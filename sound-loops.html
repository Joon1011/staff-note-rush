<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9edf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131b18" media="(prefers-color-scheme: dark)">
<title>울림 고리</title>
<meta name="description" content="점을 이어 고리를 만들면 고리가 돌면서 음악이 되는 음악 교육 퍼즐. 박, 음높이, 화음, 폴리리듬, 돌림노래.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 왼쪽은 오선지 보드(음표 길이를 고르고 점을 이어 고리를 그리는 곳), 오른쪽은 수업 패널(과제 · 정답지 · 조작). 좁은 화면에서는 과제 → 보드 → 조작 순으로 쌓인다. */
:root{
  --bg:#e9edf3; --paper:#fbfcfe; --fg:#1b2333; --muted:#596478; --staff:#cbd5e3; --rule:#d7dfea;
  --accent:#25397a; --accent-fg:#ffffff; --hl:rgba(37,57,122,.10); --ok:#2b7f50; --warn:#c23f2a;
  --ink0:#1f2b4d; --ink1:#b04f26; --ink2:#1f7a68; --ink3:#7445a3; --ink4:#8a6a12; --ink5:#2f68b3;
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131b18; --paper:#1c2824; --fg:#edf1ea; --muted:#a2b1a9; --staff:#33443e; --rule:#2d3b36;
    --accent:#f0d67a; --accent-fg:#1a1d12; --hl:rgba(240,214,122,.14); --ok:#7fd39a; --warn:#ff8b74;
    --ink0:#e8edf2; --ink1:#f4a37f; --ink2:#7fd6c1; --ink3:#cdabf2; --ink4:#e9cf7c; --ink5:#93bdf3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131b18; --paper:#1c2824; --fg:#edf1ea; --muted:#a2b1a9; --staff:#33443e; --rule:#2d3b36;
  --accent:#f0d67a; --accent-fg:#1a1d12; --hl:rgba(240,214,122,.14); --ok:#7fd39a; --warn:#ff8b74;
  --ink0:#e8edf2; --ink1:#f4a37f; --ink2:#7fd6c1; --ink3:#cdabf2; --ink4:#e9cf7c; --ink5:#93bdf3;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px))}
.backBtn{display:inline-flex;align-items:center;gap:4px;margin-bottom:10px;padding:5px 13px;border-radius:999px;
  border:1.5px solid var(--rule);background:var(--paper);color:var(--muted);font-size:13.5px;text-decoration:none}
.backBtn:hover,.backBtn:focus-visible{color:var(--fg);border-color:var(--muted)}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand h1{font-size:34px;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted)}
.chapters{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 6px;border-radius:20px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;font-size:14px}
.ch:hover{border-color:var(--muted)}
.ch-num{font-family:var(--font-display);width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--hl);font-size:14px}
.ch small{font-family:var(--font-num);font-size:11.5px;color:var(--muted)}
.ch.complete .ch-num{background:var(--ok);color:var(--paper)}
.ch[aria-current="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ch[aria-current="true"] small{color:inherit;opacity:.8}
.ch[aria-current="true"] .ch-num{background:transparent;border:1.5px solid currentColor;color:inherit}
.chapter-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.chapter-bar p{margin:0;color:var(--muted);max-width:60ch;min-width:0}
.levels{display:flex;flex-wrap:wrap;gap:6px}
.lv{font-family:var(--font-display);min-width:38px;height:38px;padding:0 11px;border-radius:19px;border:1.5px solid var(--rule);
  background:var(--paper);cursor:pointer;font-size:15px;position:relative}
.lv:hover{border-color:var(--muted)}
.lv[aria-current="step"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.lv.done::after{content:"";position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"board lesson" "board tools";gap:18px 20px;align-items:start}
.lesson{grid-area:lesson}
.tools{grid-area:tools;display:flex;flex-direction:column;gap:16px}
.board-wrap{grid-area:board;position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
#board{display:block;width:100%;touch-action:manipulation;cursor:pointer}
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-areas:"lesson" "board" "tools"}
}

.palette{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule)}
.pal-label{font-size:13px;color:var(--muted);margin-right:4px}
.pal{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 9px;border-radius:10px;border:1.5px solid var(--rule);background:var(--paper);cursor:pointer;font-size:14px}
.pal:hover{border-color:var(--muted)}
.pal[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.pal svg{flex:none}

.lesson{display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:1px 10px}
.lesson h2{font-size:24px}
.lesson p{margin:0;max-width:65ch}
.success{margin-top:6px;border-radius:12px;padding:12px 14px;background:var(--paper);border:1.5px solid var(--ok);display:flex;flex-direction:column;gap:8px}
.success strong{font-family:var(--font-display);font-weight:400;color:var(--ok);font-size:18px}
.success p{margin:0}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-head h3{font-size:17px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#gridBox{display:flex;flex-direction:column;gap:10px}
#grid{display:block;width:100%}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.lg{width:18px;height:8px;border-radius:3px;display:inline-block}
.lg.ok{background:var(--muted)}
.lg.miss{border:1.5px dashed var(--muted)}
.lg.extra{border:1.5px solid var(--warn)}
.status{margin:0;font-size:14px}
.status.ok{color:var(--ok)}
.status.warn{color:var(--warn)}

.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--font-display);font-size:16px;border-radius:12px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--rule);background:var(--paper)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{font-size:14px;padding:6px 12px;border-radius:10px}
.controls .btn{flex:1 1 130px}

.loop-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.loop-list li{display:grid;grid-template-columns:14px auto 1fr auto;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--rule);border-radius:10px}
.loop-list li.empty{display:block;color:var(--muted);border-style:dashed;font-size:14px}
.sw{width:14px;height:14px;border-radius:4px}
.loop-name{font-family:var(--font-display);white-space:nowrap}
.loop-name small{font-family:var(--font-body);color:var(--muted);font-size:12.5px;margin-left:4px}
.loop-seq{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.x{width:30px;height:30px;border-radius:8px;border:none;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.x:hover{background:var(--hl);color:var(--fg)}

.settings{display:flex;flex-direction:column;gap:10px;font-size:14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set-row input[type=range]{flex:1 1 140px;accent-color:var(--accent)}
.set-row output{font-family:var(--font-num);font-size:13px;min-width:62px;text-align:right}
.seg{display:inline-flex;border:1.5px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:none;background:none;padding:5px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

.toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:7px 14px;border-radius:999px;font-size:14px;max-width:calc(100% - 24px);text-align:center;pointer-events:none}
.draftbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;flex-wrap:wrap;
  border-top:1px solid var(--rule);padding:6px 8px 6px 14px;font-size:14px;color:var(--muted)}
.draftbar.on{color:var(--fg);background:var(--hl)}
.draftbar span{min-width:0;flex:1 1 220px}
.draft-btns{display:flex;gap:6px}
.hint{margin:0;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <a class="backBtn" href="./world.html">&#8592; 게임 월드</a>
      <h1>울림 고리</h1>
      <p>점을 이어 고리를 만들면, 고리가 돌면서 음악이 됩니다.</p>
    </div>
  </header>
  <nav class="chapters" id="chapters" aria-label="챕터"></nav>
  <div class="chapter-bar">
    <p id="chDesc"></p>
    <nav class="levels" id="levels" aria-label="단계"></nav>
  </div>

  <main class="stage">
    <section class="lesson" aria-live="polite">
      <span class="tag" id="lvTag"></span>
      <h2 id="lvTitle"></h2>
      <p id="lvText"></p>
      <div class="success" id="success" hidden>
        <strong>통과!</strong>
        <p id="learned"></p>
        <div><button class="btn primary small" id="btnNext" type="button">다음 단계</button></div>
      </div>
    </section>

    <section class="board-wrap" aria-label="오선지 보드">
      <div class="palette" id="palette" role="group" aria-label="음표 길이"></div>
      <canvas id="board" aria-label="점을 눌러 고리를 만드는 보드"></canvas>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="draftbar" id="draftbar">
        <span id="draftText"></span>
        <div class="draft-btns">
          <button class="btn small" id="btnUndo" type="button">되돌리기</button>
          <button class="btn small" id="btnCancel" type="button">취소</button>
        </div>
      </div>
    </section>

    <div class="tools">
      <section class="card" id="targetCard">
        <div class="card-head"><h3 id="gridTitle">목표 악보</h3><span class="meta" id="gridMeta"></span></div>
        <div id="gridBox" hidden>
          <canvas id="grid" aria-label="박자별 음 악보"></canvas>
          <ul class="legend" id="legend">
            <li><span class="lg ok"></span>맞은 음</li>
            <li><span class="lg miss"></span>빠진 음</li>
            <li><span class="lg extra"></span>틀린 음</li>
          </ul>
        </div>
        <p class="status" id="status"></p>
        <div><button class="btn small" id="btnReveal" type="button" aria-expanded="false" aria-controls="gridBox">정답지 보기</button></div>
      </section>

      <div class="controls">
        <button class="btn primary" id="btnPlay" type="button">내 고리 듣기</button>
        <button class="btn" id="btnTarget" type="button">목표 듣기</button>
      </div>

      <section class="card">
        <div class="card-head"><h3>내 고리</h3><span class="meta" id="loopCount"></span></div>
        <ul class="loop-list" id="loopList"></ul>
        <p class="hint" id="cycleHint"></p>
        <div><button class="btn small" id="btnClear" type="button">모두 지우기</button></div>
      </section>

      <section class="card settings">
        <div class="set-row">
          <label for="tempo">빠르기</label>
          <input type="range" id="tempo" min="50" max="140" step="2">
          <output id="tempoOut" for="tempo"></output>
        </div>
        <div class="set-row">
          <span>음 이름</span>
          <div class="seg" role="group" aria-label="음 이름 표기">
            <button type="button" id="nmSol">도레미</button>
            <button type="button" id="nmLet">CDE</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="metro"> 박 소리 (고리가 다시 만나는 박은 세게)</label>
      </section>
    </div>
  </main>
</div>

<script>
(() => {
'use strict';

/* ---------- 음 정보: 높이 = 음높이, 색 = 음 이름 ---------- */
const PITCH = [
  { s:'도', l:'C', semi:0,  c:'#e5484d', dark:false },
  { s:'레', l:'D', semi:2,  c:'#f08c2e', dark:true  },
  { s:'미', l:'E', semi:4,  c:'#f2c230', dark:true  },
  { s:'파', l:'F', semi:5,  c:'#6cc25f', dark:true  },
  { s:'솔', l:'G', semi:7,  c:'#20a69b', dark:false },
  { s:'라', l:'A', semi:9,  c:'#4a7fe0', dark:false },
  { s:'시', l:'B', semi:11, c:'#9a62d6', dark:false },
  { s:'도', l:'C', semi:12, c:'#e5484d', dark:false, high:true },
];
const R = -1;           // 쉼
const COLS = 8, ROWS = 9;
/* 시간 단위는 '반박'. 1박 = 2칸. 붓: 1 = 8분음표, 2 = 4분음표, 3 = 점4분음표, 4 = 2분음표 */
const BRUSH = {
  1:{ name:'8분음표', len:'반박' },
  2:{ name:'4분음표', len:'1박' },
  3:{ name:'점4분음표', len:'1.5박' },
  4:{ name:'2분음표', len:'2박' },
};
const MAX_STOP = 8;     // 한 음은 4박까지

/* ---------- 챕터와 단계: nodes = [열, 음], solution = 정답 고리들 [음, 길이(칸) 또는 [붙임줄로 이은 길이들]] ---------- */
const CHAPTERS = [
  { name:'박과 리듬',       desc:'박, 쉼표, 음표 길이, 엇박까지. 시간을 나누는 법을 배워요.' },
  { name:'음높이와 멜로디', desc:'높고 낮은 소리와 그 순서로 멜로디를 만들어요.' },
  { name:'화음과 반주',     desc:'여러 고리를 동시에 돌려 화음과 반주 리듬을 쌓아요.' },
  { name:'폴리리듬',        desc:'길이가 다른 고리들이 언제 다시 만나는지 들어 봐요.' },
  { name:'변형과 돌림노래', desc:'한 주제를 뒤집고, 옮기고, 늘이고, 겹쳐요. 작곡가들이 쓰는 기법이에요.' },
  { name:'청음 도전',       desc:'악보 없이 듣고 만들어요. 막히면 정답지를 열어 보세요.' },
  { name:'자유 연주',       desc:'정답 없이 고리를 만들어 나만의 음악을 들어 봐요.' },
];
const ALL = [1,2,3,4];
const LEVELS = [
  /* 1. 박과 리듬 */
  { id:'r1', ch:0, tag:'박', title:'한 점에 한 박', maxLoops:1, brushes:[2],
    text:'점을 차례로 눌러 고리를 만드세요. 처음 누른 점을 다시 누르면 고리가 닫힙니다. 빛이 점을 지나며 소리를 내요. 도와 솔이 번갈아 울리게 해 보세요.',
    learned:'고리의 점 개수가 곧 반복의 길이입니다. 1박짜리 점 2개로 된 고리는 2박마다 같은 소리를 되풀이해요.',
    nodes:[[1,0],[4,2],[6,4]], solution:[[[0,2],[4,2]]] },
  { id:'r2', ch:0, tag:'쉼표', title:'소리 없는 한 박', maxLoops:1, brushes:[2],
    text:'‘쉼’ 점은 소리를 내지 않지만 한 박을 차지합니다. 도, 쉬고, 미, 쉬는 4박을 만들어 보세요.',
    learned:'쉼표도 박의 일부입니다. 같은 음을 써도 쉼을 어디에 넣느냐에 따라 리듬이 달라져요.',
    nodes:[[1,0],[5,2],[3,4],[2,R],[6,R]], solution:[[[0,2],[R,2],[2,2],[R,2]]] },
  { id:'r3', ch:0, tag:'반박', title:'반으로 쪼갠 박', maxLoops:1, brushes:[1,2],
    text:'이제 음표 길이를 고를 수 있어요. 보드 위에서 길이를 먼저 고르고 점을 누르세요. 8분음표는 반박입니다. 도(1박), 미 미(반박씩), 솔(1박), 쉼(1박)을 만들어 보세요.',
    learned:'8분음표 두 개를 합치면 4분음표 하나와 길이가 같아요. 박은 그대로인데 그 안에 소리가 두 번 들어간 거예요.',
    nodes:[[1,0],[3,2],[5,2],[6,4],[7,R],[2,1]], solution:[[[0,2],[2,1],[2,1],[4,2],[R,2]]] },
  { id:'r4', ch:0, tag:'긴 음', title:'두 박 동안 울리기', maxLoops:1, brushes:[1,2,4],
    text:'2분음표는 2박 동안 소리를 냅니다. 도(1박), 미(1박), 솔(2박)을 만들어 보세요. 쉼 점을 쓸 때와 무엇이 다른지 들어 보세요.',
    learned:'2분음표는 4분음표 두 개 길이예요. 같은 2박이라도 ‘솔 + 쉼’은 소리가 중간에 끊기고, 2분음표 솔은 끝까지 이어져요.',
    nodes:[[1,0],[3,2],[6,4],[4,5],[2,R]], solution:[[[0,2],[2,2],[4,4]]] },
  { id:'r5', ch:0, tag:'점음표', title:'점 하나의 힘', maxLoops:1, brushes:ALL,

  { id:'e1', ch:5, tag:'청음', title:'세 음 듣기', maxLoops:1, brushes:[2],
    text:'이번엔 무슨 음인지 알려 주지 않아요. ‘목표 듣기’로 듣고 똑같이 만들어 보세요. 힌트: 음 세 개와 쉼 하나, 모두 1박.',
    learned:'미 레 도, 한 칸씩 내려왔어요. 소리가 올라가는지 내려가는지 귀로 구별해 냈어요.',
    nodes:[[2,0],[4,1],[6,2],[1,3],[5,4],[3,R]], solution:[[[2,2],[1,2],[0,2],[R,2]]] },
  { id:'e2', ch:5, tag:'청음', title:'리듬 듣기', maxLoops:1, brushes:[1,2],
    text:'듣고 만들어 보세요. 힌트: 솔과 라, 쉼만 써요. 짧은 음(반박)이 섞여 있어요.',
    learned:'솔솔(반박씩) 라 솔 쉼. 짧은 음 두 개가 한 박 안에 들어가는 걸 귀로 찾아냈어요.',
    nodes:[[1,4],[3,4],[6,4],[4,5],[7,R],[2,2]], solution:[[[4,1],[4,1],[5,2],[4,2],[R,2]]] },
  { id:'e3', ch:5, tag:'청음', title:'길이 듣기', maxLoops:1, brushes:ALL,
    text:'듣고 만들어 보세요. 힌트: 음 세 개로 4박이에요. 세 음의 길이가 모두 달라요.',
    learned:'도(1.5) 미(0.5) 솔(2). 점음표, 8분음표, 2분음표를 소리만으로 구별했어요.',
    nodes:[[1,0],[3,2],[5,4],[2,1],[7,5],[6,R]], solution:[[[0,3],[2,1],[4,4]]] },
  { id:'e4', ch:5, tag:'청음', title:'두 성부 듣기', maxLoops:2, brushes:[2,4],
    text:'듣고 만들어 보세요. 힌트: 고리 두 개. 한 고리는 1박짜리 두 음, 다른 고리는 2박짜리 두 음이에요.',
    learned:'아래는 도 솔(1박씩), 위는 미 레(2박씩). 두 소리가 섞여 있어도 하나씩 따로 들을 수 있게 됐어요.',
    nodes:[[1,0],[5,4],[3,2],[6,1],[2,3],[7,5]], solution:[[[0,2],[4,2]],[[2,4],[1,4]]] },

  /* 7. 자유 연주 */
  { id:'free', ch:6, tag:'자유', title:'자유 연주', maxLoops:6, brushes:ALL, free:true,
    text:'고리를 여섯 개까지 마음껏 만들어 보세요. 1.5박 고리와 2박 고리는 몇 박마다 만날까요? 지금까지 배운 반주, 돌림노래, 폴리리듬을 섞어 보세요.',
    learned:'',
    nodes:(() => { const a=[]; for(let p=0;p<8;p++){ a.push([(p*3)%8,p]); a.push([(p*3+4)%8,p]); } [1,3,5,7].forEach(c=>a.push([c,R])); return a; })() },
];

/* ---------- 저장 (이 브라우저에만) ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};
const CLEARED_KEY = 'ullim.cleared.v3';
const cleared = new Set(store.get(CLEARED_KEY, []));
const prefs = Object.assign({ bpm:84, metro:false, letters:false }, store.get('ullim.prefs', {}));
const savePrefs = () => store.set('ullim.prefs', prefs);

/* ---------- 상태 ---------- */
let lvIdx = 0, level, nodes = [], loops = [], draft = null, pointer = null, brush = 2;
const loopsByLevel = {};
let target = null, showAnswer = false;
const view = { P:0, mSets:[], mEvs:[], shift:0, bad:[], mismatch:0, solved:false, cycle:0 };

const $ = id => document.getElementById(id);
const board = $('board'), bctx = board.getContext('2d');
const grid = $('grid'), gctx = grid.getContext('2d');
const G = { w:0, h:0, padL:56, padR:14, padT:16, padB:16, colW:0, rowH:0, r:14, dpr:1 };

const gcd = (a,b) => b ? gcd(b, a%b) : a;
const lcm = (a,b) => a / gcd(a,b) * b;
const lcmAll = arr => arr.reduce(lcm, 1);
const sum = arr => arr.reduce((a,b) => a+b, 0);
const sameSet = (a,b) => { if(a.size!==b.size) return false; for(const x of a) if(!b.has(x)) return false; return true; };
const fmt = ticks => { const b = ticks/2; return Number.isInteger(b) ? String(b) : b.toFixed(1); };
const partsStr = parts => parts.map(fmt).join('‿');
const pname = p => p===R ? '쉼' : (prefs.letters ? PITCH[p].l : PITCH[p].s) + (PITCH[p].high ? '′' : '');
const beatLabel = c => `${Math.floor(c/2)+1}박${c%2 ? ' 그리고' : ''}`;

function noteSvg(t){
  const filled = t !== 4;
  const head = `<ellipse cx="6" cy="19" rx="4.4" ry="3.1" transform="rotate(-20 6 19)" ${filled ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.7"'}/>`;
  const stem = '<line x1="10.2" y1="18" x2="10.2" y2="3" stroke="currentColor" stroke-width="1.7"/>';
  const flag = t === 1 ? '<path d="M10.2 3 C 11 7.5, 15.5 8, 13.6 13.5" fill="none" stroke="currentColor" stroke-width="1.7"/>' : '';
  const dot = t === 3 ? '<circle cx="14.6" cy="19" r="1.6" fill="currentColor"/>' : '';
  return `<svg viewBox="0 0 17 24" width="14" height="20" aria-hidden="true">${head}${stem}${flag}${dot}</svg>`;
}

/* 고리: stops = [{node, parts:[칸...]}]. T = 전체 칸 수 */
function makeLoop(stops, ink){
  const starts = [], startIdx = {};
  let t = 0;
  stops.forEach((s, i) => { starts.push(t); startIdx[t] = i; t += sum(s.parts); });
  return { stops, ink, T:t, starts, startIdx };
}
const stopDur = s => sum(s.parts);

/* 한 주기(P칸) 동안 칸마다 시작하는 음들 ("음:길이") */
function periodOf(seqs, P){
  const sets = Array.from({ length:P }, () => new Set());
  const evs = [];
  for(const seq of seqs){
    const T = sum(seq.map(s => s.d));
    if(!T) continue;
    for(let base = 0; base < P; base += T){
      let t = base;
      for(const s of seq){
        if(t >= P) break;
        if(s.p >= 0){ const k = s.p + ':' + s.d; if(!sets[t].has(k)){ sets[t].add(k); evs.push({ t, p:s.p, d:s.d }); } }
        t += s.d;
      }
    }
  }
  return { sets, evs };
}
const mineSeqs = () => loops.map(lp => lp.stops.map(s => ({ p:nodes[s.node].pitch, d:stopDur(s) })));

/* ---------- 소리 ---------- */
let ac = null, master = null;
function ensureAudio(){
  if(!ac){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.55;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
  }
  if(ac.state === 'suspended') ac.resume();
}
/* 길이만큼 이어지는 소리: 짧게 튕긴 뒤 유지, 끝에서 놓는다 */
function tone(p, t, len, vel=1){
  if(!ac) return;
  const f = 261.63 * Math.pow(2, PITCH[p].semi/12);
  const hold = Math.max(0.09, len);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.30*vel, t+0.01);
  const dk = Math.min(0.14, hold*0.6);
  g.gain.linearRampToValueAtTime(0.17*vel, t+dk);
  g.gain.setValueAtTime(0.17*vel, t+hold);
  g.gain.linearRampToValueAtTime(0.0001, t+hold+0.09);
  g.connect(master);
  const o1 = ac.createOscillator(); o1.type='triangle'; o1.frequency.value=f; o1.connect(g);
  const g2 = ac.createGain(); g2.gain.value = 0.22; g2.connect(g);
  const o2 = ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*2; o2.connect(g2);
  [o1,o2].forEach(o => { o.start(t); o.stop(t+hold+0.12); });
}
function click(t, accent){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='sine'; o.frequency.value = accent ? 1760 : 1180;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(accent ? 0.22 : 0.09, t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0005, t+0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
}

/* ---------- 재생: 모든 고리가 같은 '반박' 시계를 공유한다 ---------- */
const tr = { mode:null, anchorTime:0, anchorTick:0, next:0, nextTime:0, endTime:0 };
const tickDur = () => 30 / prefs.bpm;
const tickAt = now => tr.anchorTick + (now - tr.anchorTime) / tickDur();

function startTransport(mode){
  ensureAudio(); if(!ac) return;
  tr.mode = mode; tr.anchorTime = ac.currentTime + 0.08; tr.anchorTick = 0;
  tr.next = 0; tr.nextTime = tr.anchorTime; tr.endTime = 0;
  updateButtons();
}
function stopTransport(){ tr.mode = null; updateButtons(); }

function scheduler(){
  if(!tr.mode || !ac) return;
  while(tr.nextTime < ac.currentTime + 0.12){
    const k = tr.next, t = tr.nextTime, td = tickDur();
    if(tr.mode === 'target'){
      if(k >= target.P){ if(!tr.endTime) tr.endTime = t; break; }
      for(const e of target.byTick[k % target.P]) tone(e.p, t, e.d*td*0.92);
      if(prefs.metro && k % 2 === 0) click(t, k % target.P === 0);
    } else {
      const played = new Set();
      for(const lp of loops){
        const idx = lp.startIdx[k % lp.T];
        if(idx === undefined) continue;
        const s = lp.stops[idx], p = nodes[s.node].pitch;
        if(p < 0) continue;
        const key = p + ':' + stopDur(s);
        if(played.has(key)) continue;
        played.add(key);
        tone(p, t, stopDur(s)*td*0.92);
      }
      const cyc = target ? target.P : view.cycle;
      if(prefs.metro && k % 2 === 0) click(t, cyc > 0 && k % cyc === 0);
    }
    tr.next++; tr.nextTime += td;
  }
}
setInterval(scheduler, 25);

function setTempo(bpm){
  if(tr.mode && ac){
    const now = ac.currentTime, k = tickAt(now);
    prefs.bpm = bpm;
    tr.anchorTick = k; tr.anchorTime = now;
    tr.nextTime = now + (tr.next - k) * tickDur();
  } else prefs.bpm = bpm;
  savePrefs();
}

/* ---------- 단계 불러오기와 채점 ---------- */
function loadLevel(i){
  stopTransport();
  lvIdx = i; level = LEVELS[i];
  nodes = level.nodes.map(([col,pitch]) => ({ col, pitch }));
  loops = loopsByLevel[level.id] || (loopsByLevel[level.id] = []);
  draft = null;
  if(level.solution){
    const seqs = level.solution.map(seq => seq.map(([p,d]) => ({ p, d: Array.isArray(d) ? sum(d) : d })));
    const P = lcmAll(seqs.map(s => sum(s.map(x => x.d))));
    const { sets, evs } = periodOf(seqs, P);
    const byTick = Array.from({ length:P }, () => []);
    evs.forEach(e => byTick[e.t].push(e));
    target = { P, sets, evs, byTick };
  } else target = null;
  $('lvTag').textContent = level.tag;
  $('lvTitle').textContent = level.free ? level.title : `${level.ch+1}-${posInCh(level)+1} · ${level.title}`;
  $('lvText').textContent = level.text;
  $('learned').textContent = level.learned;
  const nx = LEVELS[i+1];
  $('btnNext').hidden = !nx;
  if(nx) $('btnNext').textContent = nx.ch !== level.ch ? `다음 챕터: ${CHAPTERS[nx.ch].name}` : '다음 단계';
  $('btnTarget').hidden = !target;
  $('legend').hidden = !target;
  $('gridTitle').textContent = target ? '목표 악보' : '내 악보';
  showAnswer = false; applyReveal();
  brush = level.brushes.includes(2) ? 2 : level.brushes[0];
  renderPalette();
  view.solved = false;
  renderLevels(); evaluate(true); updateDraftBar(); resize();
}

function renderPalette(){
  const pal = $('palette'); pal.innerHTML = '';
  pal.hidden = level.brushes.length <= 1;
  const lab = document.createElement('span'); lab.className = 'pal-label'; lab.textContent = '음표 길이';
  pal.appendChild(lab);
  level.brushes.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pal';
    b.setAttribute('aria-pressed', String(t === brush));
    b.setAttribute('aria-label', `${BRUSH[t].name}, ${BRUSH[t].len}`);
    b.title = BRUSH[t].name;
    b.innerHTML = `${noteSvg(t)}<span>${BRUSH[t].len}</span>`;
    b.addEventListener('click', () => { brush = t; renderPalette(); });
    pal.appendChild(b);
  });
}

// 목표가 있는 단계에서는 악보를 가려 두고, 정답지 버튼으로만 펼친다. 자유 연주는 늘 보인다.
function applyReveal(){
  const free = !target;
  $('gridBox').hidden = !(free || showAnswer);
  const btn = $('btnReveal');
  btn.hidden = free;
  btn.textContent = showAnswer ? '정답지 숨기기' : '정답지 보기';
  btn.setAttribute('aria-expanded', String(showAnswer));
}

function evaluate(silent){
  const Ts = loops.map(l => l.T);
  view.cycle = Ts.length ? lcmAll(Ts) : 0;
  const was = view.solved;
  const st = $('status');
  st.className = 'status';

  if(!target){
    view.P = Math.min(view.cycle, 48);
    const r = periodOf(mineSeqs(), view.P);
    view.mSets = r.sets; view.mEvs = r.evs; view.shift = 0; view.solved = false;
    $('gridMeta').textContent = view.cycle ? `${fmt(view.cycle)}박 반복` : '';
    st.textContent = !loops.length ? '점을 눌러 고리를 만들어 보세요.'
      : view.cycle > 48 ? `악보에는 앞의 24박만 보여요. 전체 무늬는 ${fmt(view.cycle)}박마다 되풀이됩니다.` : '';
  } else {
    const P = target.P;
    view.P = P;
    const r = periodOf(mineSeqs(), P);
    let best = 0, bestMis = Infinity;
    for(let s=0; s<P; s++){
      let mis = 0;
      for(let c=0; c<P; c++) if(!sameSet(r.sets[(c+s)%P], target.sets[c])) mis++;
      if(mis < bestMis){ bestMis = mis; best = s; }
    }
    view.mSets = []; for(let c=0; c<P; c++) view.mSets.push(r.sets[(c+best)%P]);
    view.mEvs = r.evs.map(e => ({ ...e, t:(e.t - best + P) % P }));
    view.shift = best; view.mismatch = bestMis;
    view.bad = [...new Set(Ts.filter(T => P % T !== 0))];
    view.solved = loops.length > 0 && bestMis === 0 && view.bad.length === 0;
    $('gridMeta').textContent = `${fmt(P)}박 반복`;

    if(!loops.length){
      st.textContent = '점을 눌러 첫 고리를 만들어 보세요.';
    } else if(view.bad.length){
      st.className = 'status warn';
      const T = view.bad[0];
      if(loops.length === 1 && level.solution.length === 1){
        st.textContent = T < P
          ? `고리가 ${fmt(T)}박이에요. 목표 ${fmt(P)}박보다 ${fmt(P-T)}박 모자라요.`
          : `고리가 ${fmt(T)}박이에요. 목표 ${fmt(P)}박보다 ${fmt(T-P)}박 넘쳐요.`;
      } else {
        st.textContent = `${fmt(T)}박 고리는 ${fmt(P)}박 목표와 맞물리지 않아 돌 때마다 어긋나요.`;
      }
    } else if(view.solved){
      st.className = 'status ok';
      st.textContent = '목표 악보와 똑같아요!';
    } else {
      let msg = `목표와 다른 곳이 ${bestMis}군데 있어요. 음 높이와 길이를 함께 확인해 보세요.`;
      if(loops.length < level.solution.length) msg += ' 고리가 하나 더 필요해요.';
      st.textContent = msg;
    }
  }
  $('success').hidden = !view.solved;
  if(view.solved && !was){ silent ? markCleared() : onSolved(); }
  renderLoops();
}

const posInCh = lv => LEVELS.filter(l => l.ch === lv.ch).indexOf(lv);
const chLevels = ci => LEVELS.filter(l => l.ch === ci);
const chDone = ci => chLevels(ci).every(l => !l.solution || cleared.has(l.id));
function markCleared(){
  if(!cleared.has(level.id)){ cleared.add(level.id); store.set(CLEARED_KEY, [...cleared]); renderLevels(); }
}
function onSolved(){
  const before = chDone(level.ch);
  markCleared();
  toast(!before && chDone(level.ch) ? `챕터 완료! ‘${CHAPTERS[level.ch].name}’를 모두 통과했어요.` : '통과! 들어 보세요.');
  if(tr.mode !== 'mine') startTransport('mine');
}

/* ---------- 화면 조각 ---------- */
function renderLevels(){
  const chNav = $('chapters'); chNav.innerHTML = '';
  CHAPTERS.forEach((ch, ci) => {
    const lvs = chLevels(ci), graded = lvs.filter(l => l.solution);
    const done = graded.filter(l => cleared.has(l.id)).length;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ch' + (graded.length && done === graded.length ? ' complete' : '');
    b.innerHTML = `<span class="ch-num">${ci+1}</span><span>${ch.name}</span>` + (graded.length ? `<small>${done}/${graded.length}</small>` : '');
    if(ci === level.ch) b.setAttribute('aria-current', 'true');
    b.addEventListener('click', () => {
      const first = lvs.find(l => !cleared.has(l.id)) || lvs[0];
      loadLevel(LEVELS.indexOf(first));
    });
    chNav.appendChild(b);
  });
  $('chDesc').textContent = CHAPTERS[level.ch].desc;
  const nav = $('levels'); nav.innerHTML = '';
  const mine = chLevels(level.ch);
  nav.hidden = mine.length < 2;
  mine.forEach(lv => {
    const i = LEVELS.indexOf(lv);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'lv' + (cleared.has(lv.id) ? ' done' : '');
    b.textContent = `${lv.ch+1}-${posInCh(lv)+1}`;
    b.title = lv.title + (cleared.has(lv.id) ? ' (통과)' : '');
    if(i === lvIdx) b.setAttribute('aria-current', 'step');
    b.addEventListener('click', () => loadLevel(i));
    nav.appendChild(b);
  });
}

function renderLoops(){
  const ul = $('loopList'); ul.innerHTML = '';
  $('loopCount').textContent = `${loops.length} / ${level.maxLoops}`;
  if(!loops.length){
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = '아직 고리가 없어요. 보드의 점을 눌러 시작하세요.';
    ul.appendChild(li);
  }
  loops.forEach((lp, k) => {
    const li = document.createElement('li');
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = `var(--ink${lp.ink})`;
    const nm = document.createElement('span'); nm.className = 'loop-name';
    nm.innerHTML = `고리 ${k+1}<small>${fmt(lp.T)}박</small>`;
    const seq = document.createElement('span'); seq.className = 'loop-seq';
    seq.textContent = lp.stops.map(s => `${pname(nodes[s.node].pitch)} ${partsStr(s.parts)}`).join(' · ');
    const x = document.createElement('button'); x.type = 'button'; x.className = 'x';
    x.textContent = '×'; x.setAttribute('aria-label', `고리 ${k+1} 지우기`);
    x.addEventListener('click', () => { loops.splice(k, 1); evaluate(); });
    li.append(sw, nm, seq, x); ul.appendChild(li);
  });
  const h = $('cycleHint');
  if(loops.length >= 2) h.textContent = `고리 ${loops.length}개는 ${fmt(view.cycle)}박마다 모두 출발점에서 다시 만나요 (${loops.map(l => fmt(l.T)).join('박, ')}박의 최소공배수).`;
  else if(loops.length === 1) h.textContent = `이 고리는 ${fmt(view.cycle)}박마다 처음으로 돌아와요.`;
  else h.textContent = '';
  $('btnClear').hidden = !loops.length;
}

function updateButtons(){
  const p = $('btnPlay'), t = $('btnTarget');
  p.textContent = tr.mode === 'mine' ? '멈추기' : '내 고리 듣기';
  p.setAttribute('aria-pressed', String(tr.mode === 'mine'));
  t.textContent = tr.mode === 'target' ? '목표 멈추기' : '목표 듣기';
  t.setAttribute('aria-pressed', String(tr.mode === 'target'));
}

function updateDraftBar(){
  const bar = $('draftbar');
  bar.classList.toggle('on', !!draft);
  $('btnCancel').hidden = !draft; $('btnUndo').hidden = !draft;
  if(!draft){
    $('draftText').textContent = level.brushes.length > 1
      ? '음표 길이를 고르고 점을 눌러 고리를 시작하세요.'
      : '점을 눌러 고리를 시작하세요.';
    return;
  }
  const total = sum(draft.map(stopDur));
  const tie = level.brushes.length > 1 ? ' · 같은 점 한 번 더 = 붙임줄' : '';
  $('draftText').textContent = draft.length < 2
    ? `고리 그리는 중 · 지금 ${fmt(total)}박 · 다음 점을 누르세요${tie}`
    : `고리 그리는 중 · 지금 ${fmt(total)}박 · 출발점을 누르면 닫혀요${tie}`;
}

let toastTimer = 0;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/* ---------- 보드 조작 ---------- */
function nodeXY(nd){
  const row = nd.pitch >= 0 ? 7 - nd.pitch : 8;
  return { x: G.padL + (nd.col + 0.5) * G.colW, y: G.padT + (row + 0.5) * G.rowH };
}
function hitNode(x, y){
  let best = -1, bd = Math.max(G.r + 8, 22);
  nodes.forEach((nd, i) => { const p = nodeXY(nd); const d = Math.hypot(p.x-x, p.y-y); if(d < bd){ bd = d; best = i; } });
  return best;
}
function nextInk(){ const used = new Set(loops.map(l => l.ink)); for(let k=0;k<6;k++) if(!used.has(k)) return k; return 0; }
function preview(i, ticks){
  ensureAudio(); const p = nodes[i].pitch;
  if(p >= 0 && ac) tone(p, ac.currentTime + 0.01, Math.min(ticks * tickDur(), 1.6) * 0.92, 0.7);
}

function tapNode(i){
  if(!draft){
    if(loops.length >= level.maxLoops){
      toast(`이 단계에서는 고리를 ${level.maxLoops}개까지 만들 수 있어요. 고리를 지우고 다시 만들어 보세요.`);
      return;
    }
    draft = [{ node:i, parts:[brush] }]; preview(i, brush);
  } else {
    const last = draft[draft.length - 1];
    if(i === last.node){
      if(stopDur(last) + brush > MAX_STOP){ toast('한 음은 4박까지 이을 수 있어요.'); return; }
      last.parts.push(brush);
      preview(i, stopDur(last));
      toast(`붙임줄로 이어서 ${pname(nodes[i].pitch)} ${fmt(stopDur(last))}박이 됐어요.`);
    } else if(i === draft[0].node){
      loops.push(makeLoop(draft, nextInk()));
      draft = null; evaluate();
    } else if(draft.some(s => s.node === i)){
      toast('한 고리에서 같은 점은 한 번만 지나갈 수 있어요.');
    } else {
      draft.push({ node:i, parts:[brush] }); preview(i, brush);
    }
  }
  updateDraftBar();
}
function undoDraft(){
  if(!draft) return;
  const last = draft[draft.length - 1];
  if(last.parts.length > 1) last.parts.pop(); else draft.pop();
  if(!draft.length) draft = null;
  updateDraftBar();
}

function boardPoint(e){ const r = board.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let downPt = null;
board.addEventListener('pointerdown', e => { ensureAudio(); downPt = boardPoint(e); });
board.addEventListener('pointerup', e => {
  const p = boardPoint(e);
  if(!downPt || Math.hypot(p.x-downPt.x, p.y-downPt.y) > 12){ downPt = null; return; }
  downPt = null;
  const i = hitNode(p.x, p.y);
  if(i >= 0) tapNode(i);
});
board.addEventListener('pointermove', e => { if(e.pointerType === 'mouse') pointer = boardPoint(e); });
board.addEventListener('pointerleave', () => { pointer = null; });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && draft){ draft = null; updateDraftBar(); }
});

$('btnCancel').addEventListener('click', () => { draft = null; updateDraftBar(); });
$('btnUndo').addEventListener('click', undoDraft);
$('btnClear').addEventListener('click', () => { loops.length = 0; draft = null; updateDraftBar(); evaluate(); });
$('btnPlay').addEventListener('click', () => {
  if(tr.mode === 'mine') return stopTransport();
  if(!loops.length) return toast('먼저 고리를 하나 만들어 보세요.');
  startTransport('mine');
});
$('btnTarget').addEventListener('click', () => { tr.mode === 'target' ? stopTransport() : startTransport('target'); });
$('btnReveal').addEventListener('click', () => { showAnswer = !showAnswer; applyReveal(); });
$('btnNext').addEventListener('click', () => loadLevel(Math.min(lvIdx + 1, LEVELS.length - 1)));

const tempo = $('tempo');
tempo.value = prefs.bpm; $('tempoOut').textContent = `${prefs.bpm} BPM`;
tempo.addEventListener('input', () => { setTempo(+tempo.value); $('tempoOut').textContent = `${prefs.bpm} BPM`; });
const metro = $('metro'); metro.checked = prefs.metro;
metro.addEventListener('change', () => { prefs.metro = metro.checked; savePrefs(); });
function setNames(letters){
  prefs.letters = letters; savePrefs();
  $('nmSol').setAttribute('aria-pressed', String(!letters)); $('nmLet').setAttribute('aria-pressed', String(letters));
  if(level) renderLoops();
}
$('nmSol').addEventListener('click', () => setNames(false));
$('nmLet').addEventListener('click', () => setNames(true));

/* ---------- 그리기 ---------- */
function resize(){
  G.dpr = window.devicePixelRatio || 1;
  const w = board.parentElement.clientWidth;
  G.padL = w < 480 ? 44 : 58;
  G.colW = (w - G.padL - G.padR) / COLS;
  G.rowH = Math.max(34, Math.min(50, G.colW * 0.62));
  G.r = Math.max(10, Math.min(17, G.rowH * 0.36, G.colW * 0.36));
  G.w = w; G.h = Math.round(G.padT + G.padB + ROWS * G.rowH);
  board.width = Math.round(w * G.dpr); board.height = Math.round(G.h * G.dpr);
  board.style.height = G.h + 'px';
  const gw = Math.max(120, $('targetCard').clientWidth - 30);
  grid.width = Math.round(gw * G.dpr); grid.height = Math.round(132 * G.dpr);
  grid.style.height = '132px';
}
new ResizeObserver(resize).observe(board.parentElement);

function segGeom(lp, i){
  const n = lp.stops.length;
  const a = nodeXY(nodes[lp.stops[i].node]), b = nodeXY(nodes[lp.stops[(i+1)%n].node]);
  const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
  const nx = -dy/len, ny = dx/len;
  const off = ((lp.ink % 3) - 1) * 3.5;
  const bulge = n === 2 ? Math.min(len*0.22, 40) : 0;
  const p0 = { x:a.x+nx*off, y:a.y+ny*off }, p1 = { x:b.x+nx*off, y:b.y+ny*off };
  const c = { x:(p0.x+p1.x)/2 + nx*bulge, y:(p0.y+p1.y)/2 + ny*bulge };
  return { p0, p1, c };
}
function bez(g, f){ const u = 1-f; return { x:u*u*g.p0.x + 2*u*f*g.c.x + f*f*g.p1.x, y:u*u*g.p0.y + 2*u*f*g.c.y + f*f*g.p1.y }; }
function bezTan(g, f){ return { x:2*(1-f)*(g.c.x-g.p0.x) + 2*f*(g.p1.x-g.c.x), y:2*(1-f)*(g.c.y-g.p0.y) + 2*f*(g.p1.y-g.c.y) }; }

function pill(ctx, x, y, text, stroke, C){
  ctx.font = `11px ${C('font-num')}`;
  const w = ctx.measureText(text).width + 10, h = 16;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x - w/2, y - h/2, w, h, 8); else ctx.rect(x - w/2, y - h/2, w, h);
  ctx.fillStyle = C('paper'); ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = stroke; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 0.5);
}

/* 고리 안에서 지금 몇 번째 점에 있는지 */
function locate(lp, k){
  const pos = ((k % lp.T) + lp.T) % lp.T;
  let i = 0;
  for(let j=0; j<lp.starts.length; j++) if(lp.starts[j] <= pos) i = j;
  const d = stopDur(lp.stops[i]);
  return { i, since: pos - lp.starts[i], frac: (pos - lp.starts[i]) / d };
}

function draw(){
  requestAnimationFrame(draw);
  if(!G.w || !level) return;
  const cs = getComputedStyle(document.documentElement);
  const C = k => cs.getPropertyValue('--' + k).trim();
  const ink = k => C('ink' + k);
  const ctx = bctx;
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.w, G.h);
  ctx.fillStyle = C('paper'); ctx.fillRect(0, 0, G.w, G.h);

  const now = ac ? ac.currentTime : 0;
  if(tr.mode === 'target' && tr.endTime && now > tr.endTime + 0.4) stopTransport();
  const playing = tr.mode === 'mine';
  const kf = tr.mode ? Math.max(0, tickAt(now)) : 0;
  const ki = Math.floor(kf);
  const showLen = level.brushes.length > 1;

  // 오선 줄과 음 이름
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for(let row=0; row<ROWS; row++){
    const y = G.padT + (row + 0.5) * G.rowH;
    const p = row < 8 ? 7 - row : R;
    ctx.strokeStyle = C('staff'); ctx.lineWidth = 1;
    ctx.setLineDash(p === R ? [4,5] : []);
    ctx.beginPath(); ctx.moveTo(G.padL - 6, y); ctx.lineTo(G.w - G.padR, y); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C('muted');
    ctx.font = `${G.w < 480 ? 12 : 13}px ${C('font-body')}`;
    let label = p === R ? '쉼' : (prefs.letters ? PITCH[p].l : PITCH[p].s);
    if(p >= 0 && PITCH[p].high) label = prefs.letters ? 'C′' : '높은 도';
    ctx.fillText(label, 8, y);
  }

  // 고리
  loops.forEach(lp => {
    const n = lp.stops.length;
    ctx.strokeStyle = ink(lp.ink); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const g = segGeom(lp, i);
      if(i === 0) ctx.moveTo(g.p0.x, g.p0.y); else ctx.lineTo(g.p0.x, g.p0.y);
      ctx.quadraticCurveTo(g.c.x, g.c.y, g.p1.x, g.p1.y);
    }
    ctx.closePath(); ctx.stroke();
    ctx.globalAlpha = 1;
    for(let i=0;i<n;i++){
      const g = segGeom(lp, i);
      // 진행 방향 화살
      const fa = showLen ? 0.72 : 0.5;
      const m = bez(g, fa), t = bezTan(g, fa);
      const tl = Math.hypot(t.x, t.y) || 1, ux = t.x/tl, uy = t.y/tl;
      ctx.strokeStyle = C('paper'); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x - ux*4 - uy*4, m.y - uy*4 + ux*4);
      ctx.lineTo(m.x + ux*2, m.y + uy*2);
      ctx.lineTo(m.x - ux*4 + uy*4, m.y - uy*4 - ux*4);
      ctx.stroke();
      // 이 점에서 머무는 길이
      if(showLen){ const q = bez(g, 0.36); pill(ctx, q.x, q.y, partsStr(lp.stops[i].parts), ink(lp.ink), C); }
    }
  });

  // 그리는 중인 고리
  if(draft){
    ctx.strokeStyle = C('fg'); ctx.lineWidth = 2.5; ctx.setLineDash([6,6]); ctx.globalAlpha = 0.7;
    ctx.beginPath();
    draft.forEach((s, k) => { const p = nodeXY(nodes[s.node]); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    if(pointer) ctx.lineTo(pointer.x, pointer.y);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    const s0 = nodeXY(nodes[draft[0].node]);
    const pulse = (performance.now() / 900) % 1;
    ctx.strokeStyle = C('fg'); ctx.globalAlpha = 1 - pulse; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s0.x, s0.y, G.r + 4 + pulse*10, 0, Math.PI*2); ctx.stroke(); ctx.globalAlpha = 1;
    if(showLen){
      draft.forEach((s, k) => {
        const a = nodeXY(nodes[s.node]);
        let x, y;
        if(k < draft.length - 1){ const b = nodeXY(nodes[draft[k+1].node]); x = a.x + (b.x-a.x)*0.4; y = a.y + (b.y-a.y)*0.4; }
        else { x = a.x + G.r + 14; y = a.y - G.r - 6; }
        pill(ctx, x, y, partsStr(s.parts), C('fg'), C);
      });
    }
  }

  // 지금 울리는 점
  const held = new Map();
  let realign = false;
  if(playing){
    loops.forEach(lp => {
      const { i, since } = locate(lp, kf);
      const nd = lp.stops[i].node;
      const prev = held.get(nd);
      if(!prev || since < prev) held.set(nd, since);
    });
    realign = loops.length >= 2 && view.cycle && (kf % view.cycle) < 1.5;
  }

  // 출발점 표시
  loops.forEach(lp => {
    const p = nodeXY(nodes[lp.stops[0].node]);
    ctx.strokeStyle = ink(lp.ink); ctx.lineWidth = 3;
    const extra = realign ? (1 - (kf % view.cycle) / 1.5) * 6 : 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, G.r + 5 + extra + (lp.ink % 3), 0, Math.PI*2); ctx.stroke();
  });

  // 점
  nodes.forEach((nd, i) => {
    const p = nodeXY(nd), r = G.r;
    const col = nd.pitch >= 0 ? PITCH[nd.pitch].c : C('muted');
    const since = held.has(i) ? held.get(i) : -1;
    if(since >= 0){
      ctx.globalAlpha = 0.22; ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, r + 7, 0, Math.PI*2); ctx.fill();
      if(since < 1.5){
        const f = since / 1.5;
        ctx.globalAlpha = (1 - f) * 0.8; ctx.strokeStyle = col; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, r + 4 + f * 14, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    const scale = since >= 0 ? 1.1 : 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * scale, 0, Math.PI*2);
    if(nd.pitch >= 0){
      ctx.fillStyle = PITCH[nd.pitch].c; ctx.fill();
      ctx.strokeStyle = C('paper'); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = PITCH[nd.pitch].dark ? '#1b2333' : '#ffffff';
    } else {
      ctx.fillStyle = C('paper'); ctx.fill();
      ctx.strokeStyle = C('muted'); ctx.lineWidth = 1.5; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = C('muted');
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.round(r * 0.98)}px ${C('font-display')}`;
    const lbl = nd.pitch === R ? '쉼' : (prefs.letters ? PITCH[nd.pitch].l : PITCH[nd.pitch].s);
    ctx.fillText(lbl, p.x, p.y + 1);
    if(nd.pitch >= 0 && PITCH[nd.pitch].high){
      ctx.beginPath(); ctx.arc(p.x, p.y - r * 0.62, 1.8, 0, Math.PI*2); ctx.fill();
    }
  });

  // 움직이는 빛: 음 길이만큼 걸려서 다음 점으로 간다
  if(playing){
    loops.forEach(lp => {
      const { i, frac } = locate(lp, kf);
      const e = frac * frac * (3 - 2 * frac);
      const q = bez(segGeom(lp, i), e);
      ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, Math.PI*2);
      ctx.fillStyle = ink(lp.ink); ctx.fill();
      ctx.strokeStyle = C('paper'); ctx.lineWidth = 2.5; ctx.stroke();
    });
  }

  // 박 세기
  let col = -1;
  if(tr.mode){
    const cyc = target ? target.P : view.cycle;
    if(cyc){
      col = tr.mode === 'mine' && target ? (((ki - view.shift) % cyc) + cyc) % cyc : ki % cyc;
      ctx.font = `13px ${C('font-body')}`; ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillStyle = C('muted');
      ctx.fillText(`${tr.mode === 'target' ? '목표 ' : ''}${beatLabel(col)} / ${fmt(cyc)}박`, G.w - G.padR, 4);
    }
  }

  if(!$('gridBox').hidden) drawGrid(C, col);
}

/* 정답지: 칸 = 반박, 막대 길이 = 음 길이 */
function drawGrid(C, col){
  const ctx = gctx, w = grid.width / G.dpr, h = 132;
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const P = view.P, labW = 34, head = 18, rh = 13.5;
  ctx.textBaseline = 'middle';
  ctx.font = `11px ${C('font-body')}`;
  for(let p=7; p>=0; p--){
    const y = head + (7 - p + 0.5) * rh;
    ctx.fillStyle = C('muted'); ctx.textAlign = 'left';
    ctx.fillText(p === 7 ? (prefs.letters ? 'C′' : '높은도') : (prefs.letters ? PITCH[p].l : PITCH[p].s), 0, y);
  }
  if(!P){
    ctx.fillStyle = C('muted'); ctx.textAlign = 'center'; ctx.font = `13px ${C('font-body')}`;
    ctx.fillText('고리를 만들면 여기에 악보가 그려져요.', labW + (w - labW) / 2, head + 4 * rh);
    return;
  }
  const cw = (w - labW) / P;
  if(col >= 0 && col < P){ ctx.fillStyle = C('hl'); ctx.fillRect(labW + col * cw, 0, cw, h); }
  ctx.font = `10px ${C('font-num')}`; ctx.textAlign = 'center';
  for(let c=0; c<=P; c++){
    const x = labW + c * cw;
    const isBeat = c % 2 === 0, isBar = c % 8 === 0;
    ctx.strokeStyle = C(isBar ? 'muted' : 'rule'); ctx.lineWidth = isBar ? 1.2 : 1;
    ctx.globalAlpha = isBeat ? 1 : 0.45;
    ctx.beginPath(); ctx.moveTo(x + 0.5, head - 2); ctx.lineTo(x + 0.5, head + 8 * rh); ctx.stroke();
    ctx.globalAlpha = 1;
    if(c < P && isBeat && (cw * 2 >= 14 || c % 8 === 0)){ ctx.fillStyle = C('muted'); ctx.fillText(String(c/2 + 1), x + cw, 8); }
  }
  const bh = rh * 0.64;
  const bar = (t, d, p, mode, color) => {
    const y = head + (7 - p + 0.5) * rh - bh/2;
    const segs = t + d > P ? [[t, P - t], [0, t + d - P]] : [[t, d]];
    for(const [s, len] of segs){
      const x = labW + s * cw + 1.5, bw = Math.max(3, len * cw - 3);
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(x, y, bw, bh, 3); else ctx.rect(x, y, bw, bh);
      if(mode === 'miss'){ ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([3,2]); ctx.stroke(); ctx.setLineDash([]); }
      else if(mode === 'ok'){ ctx.fillStyle = color; ctx.fill(); }
      else { ctx.globalAlpha = 0.35; ctx.fillStyle = color; ctx.fill(); ctx.globalAlpha = 1; ctx.strokeStyle = C('warn'); ctx.lineWidth = 1.5; ctx.stroke(); }
    }
  };
  if(target){
    for(const e of target.evs) if(!view.mSets[e.t].has(e.p + ':' + e.d)) bar(e.t, e.d, e.p, 'miss', PITCH[e.p].c);
    for(const e of view.mEvs) bar(e.t, e.d, e.p, target.sets[e.t].has(e.p + ':' + e.d) ? 'ok' : 'extra', PITCH[e.p].c);
  } else {
    for(const e of view.mEvs) bar(e.t, e.d, e.p, 'ok', PITCH[e.p].c);
  }
}

/* ---------- 시작 ---------- */
function start(data){
  try{
    if(data && data.v === 3 && data.loopsByLevel) Object.assign(loopsByLevel, data.loopsByLevel);
  }catch(e){}
  setNames(prefs.letters);
  let first = LEVELS.findIndex(l => l.solution && !cleared.has(l.id));
  if(first < 0) first = LEVELS.length - 1;
  const want = data && data.v === 3 && Number.isInteger(data.lvIdx) ? data.lvIdx : first;
  loadLevel(Math.max(0, Math.min(LEVELS.length - 1, want)));
  updateButtons();
  requestAnimationFrame(draw);
}
start({});
})();
</script>
</body>
</html>
