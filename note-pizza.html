<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF8EC">
<title>음표 피자 가게</title>
<meta name="description" content="피자를 잘라 음표와 쉼표의 이름, 기호, 길이를 익히는 교육용 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFF8EC;
  --grid:#F1E7D2;
  --ink:#3D3730;
  --dim:#8C8578;
  --line:#E3D8C2;
  --tomato:#E0553A;
  --cheese:#F7D266;
  --crust:#D89B55;
  --leaf:#3BA67B;
  --sky:#3E7CB1;
  --ok:#3BA67B;
  --bad:#E0553A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;}
@supports(height:100dvh){html,body{height:100dvh;}}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Jua',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:max(4px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
  -webkit-user-select:none;user-select:none;
}
[hidden]{display:none!important;}
.app{
  width:100%;max-width:900px;height:100%;max-height:1000px;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/26px 26px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/26px 26px,
    var(--paper);
  border:2px solid var(--line);border-radius:16px;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;display:none;}
.view.active{display:block;}
.view.col.active{display:flex;flex-direction:column;}

h1{font-size:clamp(1.2rem,5vw,1.6rem);margin:0 0 2px;}
h2{font-size:clamp(1rem,4vw,1.2rem);margin:14px 0 6px;}
.lede{font-family:'Gaegu',cursive;font-size:clamp(.95rem,3.6vw,1.1rem);
  color:var(--dim);margin:0 0 12px;line-height:1.5;font-weight:700;}
.hand{font-family:'Gaegu',cursive;font-weight:700;}

button{font-family:inherit;color:var(--ink);cursor:pointer;}
button:active{transform:scale(.97);}

/* 게임 월드로 돌아가기 — 홈 화면 제목 위 */
.backBtn{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.82rem;color:var(--dim);text-decoration:none;
  border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;margin-bottom:10px;min-height:34px;background:#fff;
}
.backBtn:hover,.backBtn:focus-visible{color:var(--ink);border-color:var(--dim);outline:none;}

/* ---- 홈 ---- */
.rangeRow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
.pill{
  font-size:.9rem;background:#fff;border:2px solid var(--line);color:var(--dim);
  border-radius:99px;padding:8px 14px;min-height:42px;
}
.pill.on{border-color:var(--ink);color:var(--ink);background:#FFF2C9;}
.stages{display:grid;grid-template-columns:1fr;gap:9px;}
@media(min-width:600px){.stages{grid-template-columns:1fr 1fr;}}
.stage{
  background:#fff;border:3px solid var(--c,var(--crust));border-radius:14px;
  padding:11px 12px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;
}
.stage .ic{font-size:1.8rem;width:44px;text-align:center;flex-shrink:0;}
.stage .tx{flex:1;min-width:0;}
.stage .nm{font-size:1.05rem;line-height:1.15;}
.stage .ds{font-family:'Gaegu',cursive;font-weight:700;font-size:.92rem;color:var(--dim);}
.stage .st{color:var(--cheese);font-size:.82rem;letter-spacing:1px;white-space:nowrap;text-shadow:0 0 1px #b58a1a;}
.stage .st.none{color:var(--line);text-shadow:none;}
/* 단계 버튼 — 카드 안에 1·2·3단계가 나란히 */
.lvRow{display:flex;gap:6px;margin-top:7px;}
.lv{
  flex:1;min-width:0;background:var(--paper);border:2px solid var(--line);border-radius:10px;
  padding:5px 3px 4px;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:1px;
}
.lv .ln{font-size:.85rem;line-height:1.1;white-space:nowrap;}
.lv .ld{font-family:'Gaegu',cursive;font-weight:700;font-size:.72rem;color:var(--dim);line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.lv.done{border-color:var(--c,var(--crust));background:#fff;}
.foot{margin-top:14px;font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);font-size:.9rem;line-height:1.5;}

/* ---- 공통 제목줄 ---- */
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar .back{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;min-height:34px;font-size:.82rem;color:var(--dim);}
.bar .t{font-size:1.05rem;white-space:nowrap;}
.bar .r{margin-left:auto;font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);font-size:.95rem;}

/* ---- 피자 ---- */
.pizzaWrap{display:flex;justify-content:center;align-items:center;gap:6px;margin:4px 0 8px;}
.pizzaWrap svg{width:min(68vw,280px);height:auto;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));}
/* 점온음표 = 한 판 + 반 판, 그림 둘 */
.pizzaWrap.two svg{width:min(38vw,170px);}
.pizzaWrap.two svg.half{width:min(19vw,85px);}
.pizzaWrap .plus{font-size:2rem;color:var(--tomato);line-height:1;}
.pizzaWrap.shake svg{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sl{fill:rgba(255,255,255,0);stroke:none;cursor:pointer;}
.sl.on{fill:rgba(255,255,255,.55);stroke:var(--ink);stroke-width:2.5;}
.cut{stroke:#B8752F;stroke-width:3;stroke-linecap:round;}
.fs{stroke:#fff;stroke-width:2;}
.fs.rest{fill:#EFEAE0;stroke:#C9C0AE;stroke-dasharray:4 3;}
.fs.hot{filter:brightness(1.18);stroke:var(--ink);stroke-width:3;}

.cutRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}

/* ---- 음표 설명 패널 ---- */
.panel{
  background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;
  display:flex;gap:12px;align-items:center;min-height:120px;
}
.panel .big{width:84px;height:112px;flex-shrink:0;color:var(--ink);}
.panel .big svg{width:100%;height:100%;}
.panel .info{flex:1;min-width:0;}
.panel .nm{font-size:1.35rem;line-height:1.1;}
.panel .bt{font-size:1rem;color:var(--tomato);margin-top:2px;}
.panel .hint{font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);font-size:.95rem;margin-top:4px;line-height:1.35;}
.dots{display:flex;gap:6px;margin-top:8px;height:18px;align-items:center;}
.dots i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--tomato);background:#fff;transition:background .1s;}
.dots i.half{width:9px;border-radius:9px 0 0 9px;border-right:none;}
.dots i.q{width:5px;border-radius:9px 0 0 9px;border-right:none;}
.dots i.lit{background:var(--tomato);}
.dots i.rest.lit{background:#C9C0AE;}
.dots i.rest{border-color:#C9C0AE;}
.rowBtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.btn{
  background:#fff;border:2px solid var(--ink);border-radius:12px;
  padding:9px 14px;min-height:44px;font-size:.95rem;
}
.btn.primary{background:var(--tomato);border-color:var(--tomato);color:#fff;}
.btn.soft{border-color:var(--line);color:var(--dim);}
.btn:disabled{opacity:.45;cursor:default;transform:none;}
.bigBtn{
  width:100%;background:var(--tomato);color:#fff;border:none;border-radius:14px;
  padding:14px;font-size:1.15rem;min-height:54px;margin-top:10px;
  box-shadow:0 4px 0 #a83d27;
}
.bigBtn:active{box-shadow:0 1px 0 #a83d27;transform:translateY(3px);}

/* ---- 퀴즈 ---- */
.cust{
  display:flex;align-items:center;gap:12px;margin:6px 0 12px;
}
.cust .face{font-size:3rem;line-height:1;flex-shrink:0;}
.bubble{
  position:relative;flex:1;background:#fff;border:2px solid var(--ink);border-radius:16px;
  padding:12px 14px;min-height:92px;display:flex;align-items:center;gap:12px;
}
.bubble::before{
  content:"";position:absolute;left:-12px;top:34px;border:10px solid transparent;border-right-color:var(--ink);border-left:0;
}
.bubble::after{
  content:"";position:absolute;left:-8px;top:36px;border:8px solid transparent;border-right-color:#fff;border-left:0;
}
.bubble .glyph{width:60px;height:80px;flex-shrink:0;color:var(--ink);}
.bubble .glyph svg{width:100%;height:100%;}
.bubble .say{font-size:1.25rem;line-height:1.25;}
.bubble .sub{font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);font-size:.95rem;}
/* 더하기 빼기 — 말풍선 안의 식 */
.eq{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.eq .glyph{width:40px;height:54px;flex-shrink:0;color:var(--ink);}
.eq .glyph svg{width:100%;height:100%;}
.eq .op{font-size:1.5rem;line-height:1;color:var(--tomato);}
.eq .qm{font-size:1.5rem;line-height:1;background:#FFF2C9;border:2px dashed var(--crust);border-radius:10px;padding:4px 10px;}
.opt .lbl{font-size:1.1rem;}
.miss .eq .glyph{width:26px;height:35px;}
.miss .eq .op{font-size:1.1rem;}
.miss .eq .qm{font-size:.95rem;padding:2px 6px;border-width:1.5px;}
.spk{background:#fff;border:2px solid var(--line);border-radius:99px;width:40px;height:40px;font-size:1.1rem;flex-shrink:0;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.opt{
  background:#fff;border:3px solid var(--line);border-radius:14px;min-height:76px;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;
  font-size:1.15rem;transition:border-color .12s,background .12s;
}
.opt .glyph{width:46px;height:62px;color:var(--ink);}
.opt .glyph svg{width:100%;height:100%;}
.opt.good{border-color:var(--ok);background:#E6F6EE;}
.opt.bad{border-color:var(--bad);background:#FBE7E2;animation:shake .35s;}
.opt.flash{animation:flash .5s 3;}
@keyframes flash{0%,100%{background:#fff}50%{background:#E6F6EE;border-color:var(--ok)}}
.opt:disabled{cursor:default;transform:none;}
.feedback{
  margin-top:12px;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;
  display:flex;align-items:center;gap:12px;min-height:70px;
}
.feedback .glyph{width:44px;height:60px;color:var(--ink);flex-shrink:0;}
.feedback .glyph svg{width:100%;height:100%;}
.feedback .txt{font-size:1rem;line-height:1.3;}
.feedback .txt small{display:block;font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);font-size:.92rem;}
.feedback.ok{border-color:var(--ok);}

/* ---- 한 판 채우기 ---- */
.meter{font-family:'Gaegu',cursive;font-weight:700;color:var(--dim);text-align:center;margin:-2px 0 6px;font-size:1rem;}
.meter b{color:var(--tomato);font-family:'Jua';}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
@media(min-width:520px){.tray{grid-template-columns:repeat(5,1fr);}}
.tcard{
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 4px 5px;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;
}
.tcard .glyph{width:34px;height:46px;color:var(--ink);}
.tcard .glyph svg{width:100%;height:100%;}
.tcard .nm{font-size:.78rem;line-height:1.1;white-space:nowrap;}
.tcard .bt{font-family:'Gaegu',cursive;font-weight:700;font-size:.78rem;color:var(--dim);}
.tcard:disabled{opacity:.4;transform:none;cursor:default;}
.fillBtns{display:flex;gap:8px;margin-top:10px;}
.fillBtns .btn{flex:1;}

/* ---- 결과 ---- */
.resBox{text-align:center;padding-top:10px;}
.resBox .stars{font-size:2.6rem;color:var(--cheese);text-shadow:0 0 1px #b58a1a;letter-spacing:4px;margin:6px 0;}
.resBox .stars .off{color:var(--line);text-shadow:none;}
.resBox .msg{font-size:1.2rem;}
.misses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;}
.miss{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:.95rem;}
.miss .glyph{width:30px;height:40px;color:var(--ink);}
.miss .glyph svg{width:100%;height:100%;}

/* ---- 토스트 ---- */
.toast{
  position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
  background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;
  font-size:1rem;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;
}
.toast.show{opacity:1;}

@media (prefers-reduced-motion: reduce){
  .pizzaWrap.shake svg,.opt.bad,.opt.flash{animation:none;}
  .opt.flash{background:#E6F6EE;border-color:var(--ok);}
}
</style>
</head>
<body>
<div class="app">

  <!-- 홈 -->
  <div class="view active" id="home">
    <a class="backBtn" href="./world.html">&#8592; 게임 월드</a>
    <h1>🍕 음표 피자 가게</h1>
    <p class="lede">피자 한 판이 온음표예요. 반으로 자르면 2분음표, 넷으로 자르면 4분음표!<br>이름 속에 "몇 조각으로 잘랐는지"가 숨어 있어요.</p>

    <h2>배울 음표</h2>
    <div class="rangeRow">
      <button class="pill on" data-range="basic">기본 · 온~8분음표</button>
      <button class="pill" data-range="ext">확장 · 점음표·16분까지</button>
    </div>

    <h2>가게 일</h2>
    <div class="stages" id="stageList"></div>

    <p class="foot">실패 없이 천천히 해요. 틀리면 정답을 보여주고 소리도 들려줘요.<br>가게 일마다 1·2·3단계가 있어요. 별은 이 기기에만 저장돼요.</p>
  </div>

  <!-- 조각 배우기 -->
  <div class="view col" id="learn">
    <div class="bar"><button class="back" data-home>&#8592; 가게</button><div class="t">🔪 조각 배우기</div><div class="r" id="learnSeen"></div></div>
    <p class="lede" style="margin-bottom:6px">피자를 잘라 보고, 조각을 눌러 음표를 만나요.</p>
    <div class="cutRow" id="cutRow"></div>
    <div class="pizzaWrap" id="learnPizza"></div>
    <div class="panel" id="learnPanel">
      <div class="big" id="lpGlyph"></div>
      <div class="info">
        <div class="nm" id="lpName">조각을 눌러 보세요</div>
        <div class="bt" id="lpBeats"></div>
        <div class="hint" id="lpHint">위에서 자르는 방법을 고르고, 피자 조각을 톡!</div>
        <div class="dots" id="lpDots"></div>
      </div>
    </div>
    <div class="rowBtns">
      <button class="btn" id="lpPlay" disabled>▶ 다시 듣기</button>
      <button class="btn" id="lpTwin" disabled>🍽️ 쉼표 쌍둥이</button>
    </div>
  </div>

  <!-- 퀴즈 (주문 받기 · 거꾸로 주문 · 쌍둥이 찾기) -->
  <div class="view col" id="quiz">
    <div class="bar"><button class="back" data-home>&#8592; 가게</button><div class="t" id="quizTitle"></div><div class="r" id="quizProg"></div></div>
    <div class="cust">
      <div class="face" id="qFace">🐻</div>
      <div class="bubble" id="qBubble"></div>
    </div>
    <div class="opts" id="qOpts"></div>
    <div class="feedback" id="qFeedback" hidden></div>
  </div>

  <!-- 한 판 채우기 -->
  <div class="view col" id="fill">
    <div class="bar"><button class="back" data-home>&#8592; 가게</button><div class="t">🍕 한 판 채우기</div><div class="r" id="fillProg"></div></div>
    <div class="cust">
      <div class="face" id="fFace">🐰</div>
      <div class="bubble"><div><div class="say" id="fOrder"></div><div class="sub">피자 한 판은 4박이에요</div></div></div>
    </div>
    <div class="pizzaWrap" id="fillPizza"></div>
    <div class="meter">채운 박 <b id="fMeter">0</b> / 4</div>
    <div class="tray" id="tray"></div>
    <div class="fillBtns">
      <button class="btn soft" id="fUndo">↩ 하나 빼기</button>
      <button class="btn primary" id="fNext" hidden>다음 주문 →</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="view col" id="result">
    <div class="bar"><button class="back" data-home>&#8592; 가게</button><div class="t" id="resTitle"></div></div>
    <div class="resBox">
      <div class="stars" id="resStars"></div>
      <div class="msg" id="resMsg"></div>
      <p class="lede" id="resSub" style="margin-top:6px"></p>
      <div class="misses" id="resMisses"></div>
      <button class="bigBtn" id="resNext" hidden>다음 단계 →</button>
      <button class="bigBtn" id="resRetry">다시 하기</button>
      <button class="btn soft" id="resHome" style="width:100%;margin-top:8px">가게로 돌아가기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const BEAT_MS = 600;            // 1박 = 0.6초 (100 BPM)
const SAVE_KEY = 'notePizzaProgress_v1';
const FACES = ['🐻','🐰','🐱','🦊','🐼','🐸','🐥','🐶'];

/* ===================== 음표·쉼표 정의 ===================== */
const ITEMS = [
  {id:'w',  kind:'note', name:'온음표',   beats:4,   slices:1,  twin:'rw', color:'#F2A541', hint:'피자 한 판 통째로! 속이 비어 있고 기둥이 없어요.'},
  {id:'h',  kind:'note', name:'2분음표',  beats:2,   slices:2,  twin:'rh', color:'#E0553A', hint:'한 판을 둘(2)로 나눈 조각. 속이 비어 있고 기둥이 있어요.'},
  {id:'q',  kind:'note', name:'4분음표',  beats:1,   slices:4,  twin:'rq', color:'#3BA67B', hint:'한 판을 넷(4)으로 나눈 조각. 머리가 까맣게 채워졌어요.'},
  {id:'e',  kind:'note', name:'8분음표',  beats:0.5, slices:8,  twin:'re', color:'#3E7CB1', hint:'한 판을 여덟(8)으로 나눈 조각. 기둥에 꼬리가 하나!'},
  {id:'s',  kind:'note', name:'16분음표', beats:0.25,slices:16, twin:'rs', color:'#8E5BD1', hint:'열여섯(16)으로 나눈 조각. 꼬리가 둘! 꼬리가 늘수록 짧아져요.', ext:true},
  // 점음표 — 점은 "반만큼 더". shape 는 점을 뺀 본래 모양, slices/span 은 조각 배우기에서 몇 조각 중 몇 조각을 묶어 보여줄지
  {id:'dw', kind:'note', name:'점온음표', beats:6,   shape:'w', dotted:true, slices:2, span:2, color:'#E08A3C', hint:'온음표 옆의 점은 "반(2박)만큼 더". 4박 + 2박 = 6박, 피자 한 판 반이에요!', ext:true, noTwin:true},

// 더하기 빼기에서는 2박 반, ¾박 같은 길이도 나온다

  const whole = Math.floor(b + 1e-9), frac = Math.round((b - whole) * 4);

  return whole + '박' + f;
}

/* ===================== 기호 그리기 (SVG) ===================== */
// 유니코드 음표는 기기마다 모양이 달라서 직접 그린다. viewBox 0 0 60 80.
function glyphInner(it){
  if(it.kind === 'note'){
    const p = [], sh = it.shape || it.id;   // 점음표는 점을 뺀 본래 모양으로 그린다
    if(sh === 'w'){
      p.push(`<ellipse cx="30" cy="50" rx="13" ry="8" transform="rotate(-12 30 50)" fill="none" stroke="currentColor" stroke-width="4.5"/>`);
      if(it.dotted) p.push(`<circle cx="50" cy="50" r="3.2" fill="currentColor"/>`);
      return p.join('');
    }
    const hollow = sh === 'h';
    p.push(`<ellipse cx="25" cy="62" rx="11" ry="7.5" transform="rotate(-20 25 62)" ${hollow ? 'fill="none" stroke="currentColor" stroke-width="3.5"' : 'fill="currentColor"'}/>`);
    p.push(`<line x1="34.5" y1="60" x2="34.5" y2="12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>`);
    const flags = sh === 'e' ? 1 : sh === 's' ? 2 : 0;
    for(let k = 0; k < flags; k++){
      const y = 12 + k * 11;
      p.push(`<path d="M34.5 ${y} C 46 ${y+8}, 49 ${y+18}, 41 ${y+32}" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>`);
    }
    if(it.dotted) p.push(`<circle cx="42.5" cy="66" r="3.2" fill="currentColor"/>`);
    return p.join('');
  }
  // 쉼표는 오선 위에 그려야 "매달림/올라앉음"이 보인다
  const lines = [20,30,40,50,60].map(y => `<line x1="6" y1="${y}" x2="54" y2="${y}" stroke="currentColor" stroke-opacity=".4" stroke-width="1.6"/>`).join('');
  let body = '';
  const st = 'fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
  // 온쉼표·2분쉼표는 같은 칸에 들어가서 차이가 2px뿐이다. 매달린 줄 / 앉은 줄을 굵게 그려 구분이 보이게 한다.
  const seat = y => `<line x1="8" y1="${y}" x2="52" y2="${y}" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>`;
  switch(it.id){
    case 'rw': body = seat(30) + `<rect x="18" y="30" width="24" height="8.5" fill="currentColor"/>`; break;
    case 'rh': body = seat(40) + `<rect x="18" y="31.5" width="24" height="8.5" fill="currentColor"/>`; break;
    case 'rq': body = `<path d="M25 22 L36 35 L27 45 L37 57 C 29 53, 24 59, 31 66" ${st}/>`; break;
    case 're': body = `<path d="M37 32 L27 60" ${st}/><path d="M37 32 C 35 38, 29 40, 23 36" ${st}/><circle cx="23" cy="35.5" r="3.6" fill="currentColor"/>`; break;
    case 'rs': body = `<path d="M39 30 L25 66" ${st}/><path d="M39 30 C 37 36, 31 38, 25 34" ${st}/><circle cx="25" cy="33.5" r="3.6" fill="currentColor"/>`
                    + `<path d="M35 41 C 33 47, 27 49, 21 45" ${st}/><circle cx="21" cy="44.5" r="3.6" fill="currentColor"/>`; break;
  }
  return lines + body;
}
// 쉼표는 오선 가운데만 쓰므로 확대해서 보여준다
const glyphSVG = it => `<svg viewBox="${it.kind === 'rest' ? '0 14 60 52' : '0 0 60 80'}" aria-label="${it.name}">${glyphInner(it)}</svg>`;
const glyphBox = (it, cls='glyph') => `<div class="${cls}">${glyphSVG(it)}</div>`;

/* ===================== 피자 그리기 ===================== */
const CX = 100, CY = 100, R = 94;
function polar(deg, r){ const a = (deg - 90) * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
function sector(a0, a1, r = R){
  if(a1 - a0 >= 360) return `M${CX-r} ${CY} A${r} ${r} 0 1 1 ${CX+r} ${CY} A${r} ${r} 0 1 1 ${CX-r} ${CY} Z`;
  const [x0,y0] = polar(a0, r), [x1,y1] = polar(a1, r);
  const large = a1 - a0 > 180 ? 1 : 0;
  return `M${CX} ${CY} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z`;
}
let clipSeq = 0;
// half=true 면 오른쪽 반 판만 그린다 (점온음표의 "반 판 더")
function pizzaSVG(half = false){
  const tops = [[66,70],[126,62],[140,118],[82,136],[108,98],[60,110],[120,145]].map(([x,y]) =>
    `<circle cx="${x}" cy="${y}" r="8" fill="#B83A2E"/><circle cx="${x-2}" cy="${y-2}" r="2.2" fill="#d9574a"/>`).join('');
  const basil = [[95,70],[135,95],[75,105]].map(([x,y]) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4" transform="rotate(-30 ${x} ${y})" fill="#4E9A51"/>`).join('');
  const id = 'halfClip' + (++clipSeq);
  const clip = half ? `<clipPath id="${id}"><path d="${sector(0, 180)}"/></clipPath>` : '';
  return `<svg viewBox="${half ? '100 0 100 200' : '0 0 200 200'}" class="${half ? 'half' : ''}">${clip}
    <g ${half ? `clip-path="url(#${id})"` : ''}>
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="#D89B55"/>
      <circle cx="${CX}" cy="${CY}" r="82" fill="#E0553A"/>
      <circle cx="${CX}" cy="${CY}" r="78" fill="#F7D266"/>
      ${tops}${basil}
    </g>
    <g class="sliceLayer"></g><g class="cutLayer"></g><g class="glyphLayer"></g>
  </svg>`;
}
function glyphAt(it, deg, r, size){
  const [x,y] = polar(deg, r);
  const w = size, h = size * 80 / 60;
  return `<svg x="${(x - w/2).toFixed(1)}" y="${(y - h/2).toFixed(1)}" width="${w}" height="${h}" viewBox="0 0 60 80" style="color:#3D3730;pointer-events:none">${glyphInner(it)}</svg>`;
}

/* ===================== 소리 ===================== */
let ac = null;
function ensureAudio(){
  if(!ac){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(freq, dur, type = 'triangle', vol = .25, delay = 0){
  const a = ensureAudio(); if(!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.setValueAtTime(vol, t + Math.max(.03, dur - .08));
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + .05);
}
const tick = strong => tone(strong ? 1200 : 900, .05, 'square', .07);
function ding(){ tone(880, .12, 'sine', .22); tone(1320, .22, 'sine', .22, .09); }
function boop(){ tone(180, .25, 'sawtooth', .12); }
function buzz(ms = 12){ if(navigator.vibrate) navigator.vibrate(ms); }
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = .9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

// 음표 하나를 박 세며 들려준다. 쉼표는 소리 없이 틱만.

  stopDemo(); ensureAudio();
  const total = it.beats * BEAT_MS;
  if(it.kind === 'note') tone(523.25, total / 1000, 'triangle', .28);
  const n = Math.ceil(it.beats);
  for(let b = 0; b < n; b++) demoTimers.push(setTimeout(() => { tick(b === 0); onBeat && onBeat(b); }, b * BEAT_MS));
  demoTimers.push(setTimeout(() => onEnd && onEnd(), total));
}

$('cutRow').addEventListener('click', e => {
  const b = e.target.closest('[data-cut]'); if(!b) return;
  buzz(); cutPizza(b.dataset.cut);
  document.querySelectorAll('#cutRow .pill').forEach(p => p.classList.toggle('on', p === b));

function cutPizza(id){
  const it = BY[id];
  // 점음표는 slices 조각 중 span 조각을 한 묶음으로 보여준다 (점4분음표 = 8조각 중 3조각)
  const n = it.slices;
  learn.cut = id; learn.n = n; learn.sel = null;
  const wrap = $('learnPizza');
  wrap.classList.toggle('two', it.id === 'dw');
  if(it.id === 'dw'){
    // 점온음표 = 한 판(4박) + 반 판(2박). 한 판에 다 안 들어가니 그림을 둘로 나눈다
    wrap.innerHTML = pizzaSVG() + `<div class="plus">+</div>` + pizzaSVG(true);
    const [full, half] = wrap.querySelectorAll('svg');
    full.querySelector('.sliceLayer').innerHTML = `<path class="sl" data-i="0" d="${sector(0, 360)}"/>`;
    half.querySelector('.sliceLayer').innerHTML = `<path class="sl" data-i="0" d="${sector(0, 180)}"/>`;
    half.querySelector('.cutLayer').innerHTML = `<line class="cut" x1="${CX}" y1="${CY - R}" x2="${CX}" y2="${CY + R}"/>`;
    $('lpName').textContent = '한 판과 반 판이에요. 눌러 보세요';
    $('lpBeats').textContent = '';
    $('lpHint').textContent = '한 판(4박)에 반 판(2박)을 더한 길이예요';
    $('lpGlyph').innerHTML = ''; $('lpDots').innerHTML = '';
    $('lpPlay').disabled = true; $('lpTwin').disabled = true;
    tone(380, .08, 'square', .1);
    return;
  }
  wrap.innerHTML = pizzaSVG();
  const svg = wrap.querySelector('svg');
  const sl = svg.querySelector('.sliceLayer'), cl = svg.querySelector('.cutLayer');
  let s = '', c = '';
  for(let i = 0; i < n; i++){
    s += `<path class="sl" data-i="${i}" d="${sector(i * 360 / n, (i + 1) * 360 / n)}"/>`;
    if(n > 1){ const [x,y] = polar(i * 360 / n, R); c += `<line class="cut" x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
  }
  sl.innerHTML = s; cl.innerHTML = c;
  $('lpName').textContent = n === 1 ? '피자 한 판을 눌러 보세요' : `${n}조각으로 잘랐어요. 하나를 눌러 보세요`;
  $('lpBeats').textContent = '';
  $('lpHint').textContent = it.span ? `${n}조각 중 ${it.span}조각이 한 묶음이에요` : '';
  $('lpGlyph').innerHTML = ''; $('lpDots').innerHTML = '';
  $('lpPlay').disabled = true; $('lpTwin').disabled = true;
  tone(300 + n * 40, .08, 'square', .1);
}
$('learnPizza').addEventListener('click', e => {
  const p = e.target.closest('.sl'); if(!p || !learn.cut) return;
  buzz();
  const it = BY[learn.cut];
  const i = +p.dataset.i, n = learn.n;
  if(it.id === 'dw'){
    // 두 그림을 다 켜고, 한 판엔 온음표·반 판엔 2분음표를 올린다
    const [full, half] = $('learnPizza').querySelectorAll('svg');
    $('learnPizza').querySelectorAll('.sl').forEach(x => x.classList.add('on'));
    full.querySelector('.glyphLayer').innerHTML = glyphAt(BY.w, 0, 0, 56);
    half.querySelector('.glyphLayer').innerHTML = glyphAt(BY.h, 90, 48, 44);
    learn.sel = it; learn.twin = false;
    showLearnItem(it);
    if(!progress.learnSeen.includes(it.id)){ progress.learnSeen.push(it.id); save(); updateLearnSeen(); }
    return;
  }
  const svg = $('learnPizza').querySelector('svg');
  svg.querySelectorAll('.sl').forEach(x => x.classList.remove('on'));
  const span = it.span || 1;      // 점4분음표 = 8분 조각 3개
  for(let k = 0; k < span; k++){
    const idx = (i + k) % n;
    svg.querySelector(`.sl[data-i="${idx}"]`).classList.add('on');
  }
  const midDeg = (i + span / 2) * 360 / n;
  svg.querySelector('.glyphLayer').innerHTML = span >= n ? glyphAt(it, 0, 0, 56) : glyphAt(it, midDeg, n <= 2 ? 48 : 56, n >= 16 && span === 1 ? 24 : 34);
  learn.sel = it; learn.twin = false;
  showLearnItem(it);
  if(!progress.learnSeen.includes(it.id)){ progress.learnSeen.push(it.id); save(); updateLearnSeen(); }
});
function showLearnItem(it){
  $('lpGlyph').innerHTML = glyphSVG(it);
  $('lpName').textContent = it.name;
  $('lpBeats').textContent = it.kind === 'rest' ? `소리 없이 ${beatsLabel(it.beats)} 쉬어요` : beatsLabel(it.beats);
  $('lpHint').textContent = it.kind === 'rest' ? `${BY[it.twin].name}와 길이가 같은 쌍둥이. ${it.tip}.` : it.hint;
  renderDots($('lpDots'), it);
  $('lpPlay').disabled = false;
  $('lpTwin').disabled = !(learn.sel && learn.sel.twin);
  $('lpTwin').textContent = learn.twin ? '🎵 음표로 돌아가기' : '🍽️ 쉼표 쌍둥이';
  playWithDots(it, $('lpDots'));
}
function renderDots(el, it){
  let html = '', b = it.beats;
  const cls = it.kind === 'rest' ? ' rest' : '';
  while(b >= 1){ html += `<i class="${cls}"></i>`; b -= 1; }
  if(b >= 0.5){ html += `<i class="half${cls}"></i>`; b -= 0.5; }
  if(b > 0) html += `<i class="q${cls}"></i>`;
  el.innerHTML = html;
}
function playWithDots(it, el){
  const dots = el.querySelectorAll('i'); dots.forEach(d => d.classList.remove('lit'));
  playItem(it, b => { if(dots[b]) dots[b].classList.add('lit'); }, () => {});
}
$('lpPlay').addEventListener('click', () => { buzz(); const it = learn.twin ? BY[learn.sel.twin] : learn.sel; if(it) playWithDots(it, $('lpDots')); });
$('lpTwin').addEventListener('click', () => {
  if(!learn.sel || !learn.sel.twin) return;
  buzz(); learn.twin = !learn.twin;
  showLearnItem(learn.twin ? BY[learn.sel.twin] : learn.sel);
});

/* ===================== 2·3·4·5. 퀴즈 ===================== */
const QUIZ_TITLE = {order:'🧾 주문 받기', reverse:'🗣️ 거꾸로 주문', twin:'🍽️ 쌍둥이 찾기', math:'➕ 더하기 빼기'};
let quiz = null;
// 단계별 출제 범위 — 1단계 음표만, 2단계 쉼표만, 3단계 전부
function quizPool(stage, lv){
  const items = ITEMS.filter(inRange);
  const notes = items.filter(i => i.kind === 'note'), rests = items.filter(i => i.kind === 'rest');
  if(stage === 'twin'){
    const twinNotes = notes.filter(i => !i.noTwin);
    return lv === 1 ? twinNotes : lv === 2 ? rests : twinNotes.concat(rests);
  }
  return lv === 1 ? notes : lv === 2 ? rests : items;
}
// 보기 3개. 3단계는 길이가 가장 가까운(헷갈리는) 것 하나 + 아무거나 둘
function distractors(answer, cands, lv){
  const others = cands.filter(o => o !== answer);
  if(lv < 3) return shuffle(others).slice(0, 3);
  const near = others.slice().sort((a, b) => Math.abs(Math.log2(a.beats / answer.beats)) - Math.abs(Math.log2(b.beats / answer.beats)));
  return [near[0]].concat(shuffle(near.slice(1)).slice(0, 2));
}
function startQuiz(stage, lv){
  quiz = {stage, lv, n: 0, total: 10, correct: 0, misses: [], last: null, lock: false};
  $('quizTitle').textContent = QUIZ_TITLE[stage];
  showView('quiz'); nextQ();
}
function nextQ(){
  if(quiz.n >= quiz.total) return finishQuiz();
  quiz.n++; quiz.lock = false;
  $('quizProg').textContent = `${quiz.lv}단계 · ${quiz.n} / ${quiz.total}`;
  $('qFace').textContent = FACES[quiz.n % FACES.length];
  $('qFeedback').hidden = true;
  if(quiz.stage === 'math') return nextMath();
  const pool = quizPool(quiz.stage, quiz.lv);
  let it; do{ it = pick(pool); } while(it === quiz.last && pool.length > 1);
  quiz.last = it;
  let answer, optPool;
  if(quiz.stage === 'twin'){
    answer = BY[it.twin];
    optPool = ITEMS.filter(i => i.kind === answer.kind && inRange(i) && !i.noTwin);
  } else { answer = it; optPool = pool; }
  const opts = shuffle([answer, ...distractors(answer, optPool, quiz.lv)]);
  const desc = answer.kind === 'rest' ? answer.tip : answer.hint;
  const play = () => playItem(answer.kind === 'note' ? answer : BY[answer.twin]);   // 쉼표면 쌍둥이 음표 소리로 길이를 익힌다
  quiz.q = {
    key: answer.id, miss: answer, play,
    fbOk: `${glyphBox(answer)}<div class="txt">딩동! ${answer.name} · ${beatsLabel(answer.beats)}<small>${desc}</small></div>`,
    fbBad: `${glyphBox(answer)}<div class="txt">정답은 ${answer.name} · ${beatsLabel(answer.beats)}<small>${desc}</small></div>`,
  };
  const B = $('qBubble');
  if(quiz.stage === 'order'){
    B.innerHTML = `${glyphBox(it)}<div><div class="say">이거 주세요!</div><div class="sub">이 기호의 이름은?</div></div>`;
  } else if(quiz.stage === 'reverse'){
    B.innerHTML = `<div style="flex:1"><div class="say">${it.name} 주세요!</div><div class="sub">맞는 기호를 골라요</div></div><button class="spk" id="qSpeak" aria-label="다시 듣기">🔈</button>`;
    $('qSpeak').addEventListener('click', () => { buzz(); speak(`${it.name} 주세요`); });
  } else {
    const w = answer.kind === 'rest' ? '쉼표' : '음표';
    B.innerHTML = `${glyphBox(it)}<div><div class="say">이 ${it.name}랑<br>쌍둥이 ${w} 주세요!</div><div class="sub">길이가 같은 ${w}를 찾아요</div></div>`;
  }
  $('qOpts').innerHTML = opts.map(o =>
    quiz.stage === 'order'
      ? `<button class="opt" data-key="${o.id}"><span class="lbl">${o.name}</span></button>`
      : `<button class="opt" data-key="${o.id}">${glyphBox(o)}</button>`
  ).join('');
}

/* ---- 더하기 빼기 ---- */
// 1단계 더하기, 2단계 빼기(긴 것 − 짧은 것), 3단계 섞어서.
// 식은 음표끼리 또는 쉼표끼리만 — 음표 문제와 쉼표 문제가 번갈아 나온다. 음표와 쉼표를 한 식에 섞지는 않는다.
// 정답은 언제나 음표(쉼표) 하나의 길이다 — 음표 9개(16분·8분·점8분·4분·점4분·2분·점2분·온·점온), 쉼표 5개.
// 그래서 "2박 반" 같은 답은 안 나오고, 모든 문제를 박자·이름·기호 어느 형식으로도 낼 수 있다.
// 더하기 빼기는 범위(기본/확장)와 상관없이 음표 9개를 다 쓴다.
const mathFam = kind => ITEMS.filter(i => i.kind === kind);
function mathCombos(lv, kind = 'note'){
  const fam = mathFam(kind);
  const ops = lv === 1 ? ['+'] : lv === 2 ? ['−'] : ['+', '−'];
  const out = [];
  for(const a of fam) for(const b of fam) for(const op of ops){
    const res = op === '+' ? a.beats + b.beats : a.beats - b.beats;
    if(res <= 1e-9 || !fam.some(n => Math.abs(n.beats - res) < 1e-9)) continue;   // 결과가 음표(쉼표) 길이가 아니면 안 낸다
    out.push({a, b, op, res, kind});
  }
  return out;
}
const eqHtml = (a, b, op, ans) => `<div class="eq">${glyphBox(a)}<span class="op">${op}</span>${glyphBox(b)}<span class="op">=</span><span class="qm">${ans}</span></div>`;
const FMT_TAG = {beats:'🔢 박자 문제', name:'🔤 이름 문제', glyph:'🎼 기호 문제'};
function nextMath(){
  const lv = quiz.lv;
  // 음표 문제와 쉼표 문제를 번갈아 낸다
  const kind = quiz.last ? (quiz.last.kind === 'note' ? 'rest' : 'note') : pick(['note', 'rest']);
  const combos = mathCombos(lv, kind);
  const fam = mathFam(kind);                                     // 같은 종류(음표끼리 / 쉼표끼리)
  let c; do{ c = pick(combos); } while(combos.length > 1 && quiz.last && c.a === quiz.last.a && c.b === quiz.last.b && c.op === quiz.last.op);
  quiz.last = c;
  const {a, b, op, res} = c;
  const la = beatsLabel(a.beats), lb = beatsLabel(b.beats), lr = beatsLabel(res);
  const line = `${a.name}(${la}) ${op} ${b.name}(${lb}) = ${lr}`;
  const answer = fam.find(n => Math.abs(n.beats - res) < 1e-9);
  const W = kind === 'rest' ? '쉼표' : '음표';
  // 문제마다 형식 하나 — 박자 문제 / 이름 문제 / 기호 문제. 보기 4개는 모두 같은 형식.
  // 세 형식을 세 문제마다 한 번씩 섞어 돌리므로 10문제에 고루 나온다.
  if(!quiz.fmtQueue || !quiz.fmtQueue.length) quiz.fmtQueue = shuffle(['beats', 'name', 'glyph']);
  const fmt = quiz.fmtQueue.shift();
  const four = shuffle([answer, ...distractors(answer, fam, lv)]);   // 보기 4개는 길이가 다른 음표(쉼표) 4개
  const opts = four.map(o => ({key: o.id, html: fmt === 'glyph' ? glyphBox(o) : `<span class="lbl">${fmt === 'name' ? o.name : beatsLabel(o.beats)}</span>`}));
  const key = answer.id;
  const ask = fmt === 'beats'
    ? (kind === 'rest' ? (op === '+' ? '쉼표 둘을 합치면 몇 박 쉬어요?' : '긴 쉼표에서 짧은 쉼표를 빼면 몇 박?') : (op === '+' ? '둘을 합치면 몇 박?' : '긴 것에서 짧은 것을 빼면 몇 박?'))
    : (op === '+' ? `합친 길이와 같은 ${W}는?` : `남은 길이와 같은 ${W}는?`);
  const sub = `<b style="color:var(--tomato)">${FMT_TAG[fmt]}</b> · ${ask}`;
  const miss = {k: a.id + op + b.id, html: eqHtml(a, b, op, `${answer.name}<br><small class="hand">${lr}</small>`)};
  const fbAns = `${answer.name} (${lr})`;
  const okTip = kind === 'rest'
    ? (op === '+' ? '두 쉼표를 합친 만큼 소리 없이 박만 세요' : '뺀 만큼 남은 쉼을 박으로 세요')
    : (op === '+' ? '두 길이를 합친 만큼 소리가 나요' : '뺀 만큼 남은 길이를 들려줘요');
  quiz.q = {
    key, miss, play: () => playItem({kind, beats: res}),    // 쉼표 문제는 소리 없이 틱만
    fbOk: `<div class="txt">딩동! ${line}<small>${okTip}</small></div>`,
    fbBad: `<div class="txt">정답은 ${fbAns}<small>${line}</small></div>`,
  };
  $('qBubble').innerHTML = `<div style="flex:1">${eqHtml(a, b, op, '?')}<div class="sub">${sub}</div></div>`;
  $('qOpts').innerHTML = opts.map(o => `<button class="opt" data-key="${o.key}">${o.html}</button>`).join('');
}

$('qOpts').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b || quiz.lock) return;
  quiz.lock = true; buzz();
  const q = quiz.q;
  $('qOpts').querySelectorAll('.opt').forEach(x => x.disabled = true);
  const F = $('qFeedback'); F.hidden = false;
  if(b.dataset.key === q.key){
    quiz.correct++; b.classList.add('good'); ding();
    F.className = 'feedback ok'; F.innerHTML = q.fbOk;
    q.play();
    setTimeout(nextQ, 1100);
  } else {
    b.classList.add('bad'); boop(); buzz(40);
    const good = $('qOpts').querySelector(`.opt[data-key="${q.key}"]`); if(good) good.classList.add('flash');
    quiz.misses.push(q.miss);
    F.className = 'feedback'; F.innerHTML = q.fbBad;
    q.play();
    setTimeout(nextQ, 2300);
  }
});
function finishQuiz(){
  const c = quiz.correct, n = quiz.total;
  const stars = c === n ? 3 : c >= 8 ? 2 : 1;
  setStars(starKey(quiz.stage, quiz.lv), stars);
  const seen = new Set(), uniq = quiz.misses.filter(m => { const k = m.k || m.id; if(seen.has(k)) return false; seen.add(k); return true; });
  showResult({
    title: `${QUIZ_TITLE[quiz.stage]} ${quiz.lv}단계`, stars,
    msg: c === n ? '완벽해요! 손님들이 모두 기뻐해요 🎉' : c >= 8 ? '잘했어요! 조금만 더 하면 완벽!' : '괜찮아요. 틀린 건 다시 보고 또 해 봐요',
    sub: `${n}문제 중 ${c}개를 맞혔어요`,
    misses: uniq,
  });
}

    {say:'4분음표는 빼고<br>채워 주세요', ok:s => cnt(s, 'q') === 0, fail:'4분음표가 들어 있어요'},

  ],
};
let fill = null;
const fillTotal = () => fill.slices.reduce((a, x) => a + x.beats, 0);
function startFill(lv = 1){
  fill = {lv, orders: ORDERS[lv].filter(o => !o.ext || progress.range === 'ext'), idx: 0, slices: [], mistakes: 0, lock: false};
  $('fillPizza').innerHTML = pizzaSVG();
  const tray = ITEMS.filter(i => inRange(i) && i.beats <= 4);   // 점온음표(6박)는 한 판에 안 들어간다
  $('tray').innerHTML = tray.map(i => `<button class="tcard" data-id="${i.id}">${glyphBox(i)}<div class="nm">${i.name}</div><div class="bt">${beatsLabel(i.beats)}</div></button>`).join('');

}
function renderOrder(){
  const o = fill.orders[fill.idx];
  fill.slices = []; fill.lock = false;
  $('fillProg').textContent = `${fill.lv}단계 · 주문 ${fill.idx + 1} / ${fill.orders.length}`;
  $('fFace').textContent = FACES[(fill.idx + 3) % FACES.length];

}
function renderFillPizza(){
  const svg = $('fillPizza').querySelector('svg');
  let deg = 0, s = '', g = '';
  fill.slices.forEach((it, i) => {

    const size = sweep >= 90 ? 30 : sweep >= 45 ? 24 : 18;
    g += glyphAt(it, deg + sweep / 2, sweep >= 360 ? 0 : 56, size);

$('tray').addEventListener('click', e => {

$('fUndo').addEventListener('click', () => { if(fill.lock || !fill.slices.length) return; buzz(); fill.slices.pop(); renderFillPizza(); });

      const el = svg.querySelector(`.fs[data-i="${i}"]`); if(el) el.classList.add('hot');
      tick(true);
      if(it.kind === 'note') tone(523.25, dur / 1000, 'triangle', .28);
    }, t));
    t += dur;
  });
  demoTimers.push(setTimeout(() => {
    svg.querySelectorAll('.fs').forEach(x => x.classList.remove('hot'));
    toast('완성! 손님이 맛있게 먹어요 🍕');
    if(fill.idx + 1 < fill.orders.length) $('fNext').hidden = false;
    else setTimeout(finishFill, 800);
  }, t + 200));
}
$('fNext').addEventListener('click', () => { buzz(); fill.idx++; renderOrder(); });
function finishFill(){
  const m = fill.mistakes;
  const stars = m === 0 ? 3 : m <= 3 ? 2 : 1;
  setStars(starKey('fill', fill.lv), stars);
  showResult({
    title: `🍕 한 판 채우기 ${fill.lv}단계`, stars,
    msg: m === 0 ? '한 번도 안 넘치고 다 채웠어요! 🎉' : m <= 3 ? '주문을 다 받았어요! 잘했어요' : '주문을 다 받았어요. 박 수를 잘 세면 더 쉬워요',
    sub: `${fill.orders.length}개 주문 완료 · 넘치거나 틀린 횟수 ${m}번`,
    misses: [],
  });
}

/* ===================== 결과 ===================== */
function showResult({title, stars, msg, sub, misses}){
  $('resTitle').textContent = title;
  $('resStars').innerHTML = starStr(stars);
  $('resMsg').textContent = msg;
  $('resSub').textContent = sub;
  $('resMisses').innerHTML = misses.length
    ? `<div style="width:100%;font-size:.95rem;color:var(--dim)">다시 볼 것</div>` + misses.map(m => m.html
        ? `<div class="miss">${m.html}</div>`   // 더하기 빼기의 식
        : `<div class="miss">${glyphBox(m)}<span>${m.name}<br><small class="hand" style="color:var(--dim)">${beatsLabel(m.beats)}</small></span></div>`).join('')
    : '';
  // 다음 단계가 있으면 바로 이어갈 수 있게
  const st = STAGE_BY[lastStage];
  $('resNext').hidden = !(st && lastLv < st.lv.length);
  showView('result');
  if(stars === 3) setTimeout(() => { tone(659, .15, 'sine', .2); tone(784, .15, 'sine', .2, .15); tone(1047, .35, 'sine', .22, .3); }, 100);
}
$('resRetry').addEventListener('click', () => { buzz(); startStage(lastStage, lastLv); });
$('resNext').addEventListener('click', () => { buzz(); startStage(lastStage, lastLv + 1); });
$('resHome').addEventListener('click', () => { buzz(); renderHome(); showView('home'); });

renderHome();
if(new URLSearchParams(location.search).get('debug') === '1') window.__pz = {ITEMS, BY, STAGES, ORDERS, startStage, nextQ, mathCombos, get quiz(){ return quiz; }, get fill(){ return fill; }, progress};
})();
</script>
