<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17102B">
<title>망치 박자 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17102B;
    --bg-panel:#221a3f;
    --bg-panel-2:#2c2154;
    --gold:#FFC857;
    --coral:#FF6B6B;
    --teal:#4ECDC4;
    --text-primary:#F4EFFF;
    --text-muted:#b3a6dd;
    --pad: max(10px, env(safe-area-inset-left));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    background:radial-gradient(circle at 50% 0%, #241a46 0%, var(--bg-deep) 70%);
    color:var(--text-primary);
    font-family:'Baloo 2', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:
      max(6px, env(safe-area-inset-top))
      var(--pad)
      max(6px, env(safe-area-inset-bottom))
      var(--pad);
    -webkit-user-select:none; user-select:none;
  }

  .stage{
    width:100%;
    max-width:820px;
    height:100%;
    max-height:900px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:2px solid #3d2f70;
    border-radius:18px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    padding:10px 12px 12px;
    display:flex; flex-direction:column; gap:8px;
    position:relative; overflow:hidden;
  }

  .titlebar{display:flex; align-items:baseline; gap:8px; flex-shrink:0;}
  h1{
    font-size:clamp(.95rem, 3.6vw, 1.35rem);
    margin:0; color:var(--gold); letter-spacing:.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:clamp(.62rem, 2.2vw, .8rem);
    margin:0;
  }
  @media (max-height:620px){ .sub{display:none;} }

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace;
    font-size:clamp(.72rem, 2.8vw, .95rem);
    flex-shrink:0;
  }
  .lives{display:flex; gap:3px; font-size:1.15em;}
  .heart{transition:opacity .25s, transform .25s;}
  .heart.off{opacity:.16; transform:scale(.8);}
  .combo{color:var(--coral); font-weight:700;}
  .score{color:var(--teal);}

  .beatBar{display:flex; justify-content:center; align-items:center; gap:8px; flex-shrink:0;}
  .beatDot{
    width:12px; height:12px; border-radius:50%;
    background:var(--teal); transition:transform .09s ease-out, background .09s ease-out;
  }
  .beatDot.pulse{ transform:scale(1.7); background:var(--gold); }

  .arena{
    position:relative; flex:1 1 auto; min-height:160px;
  }
  .moleGrid{
    position:absolute; inset:0;
    display:grid; grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(2, 1fr);
    gap:10px;
  }
  .hole{
    position:relative;
    background:#150e29; border:2px solid #40315f; border-radius:18px;
    overflow:hidden; cursor:pointer; touch-action:manipulation;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .hole .dirt{
    position:absolute; bottom:0; left:8%; right:8%; height:26%;
    background:#2c2154; border-radius:50% 50% 0 0 / 100% 100% 0 0;
  }
  .mole{
    position:absolute; bottom:-70%; left:50%; transform:translateX(-50%);
    font-size:clamp(2.1rem, 11vw, 3.4rem); line-height:1;
    transition:bottom .12s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }
  .hole.up .mole{ bottom:14%; }
  .hole.hitGood{ background:rgba(255,200,87,.14); border-color:var(--gold); }
  .hole.hitGood .mole{ animation:caughtPop .24s ease-out forwards; }
  @keyframes caughtPop{
    0%{ transform:translateX(-50%) scale(1) rotate(0); }
    40%{ transform:translateX(-50%) scale(1.35) rotate(-10deg); }
    100%{ transform:translateX(-50%) scale(.2) rotate(8deg); opacity:0; }
  }
  .hole.hitMiss{ background:rgba(255,107,107,.16); border-color:var(--coral); }
  .hammerFx{
    position:absolute; top:6%; font-size:clamp(1.7rem, 8vw, 2.6rem);
    opacity:0; transform:translateY(-16px) rotate(-35deg);
    transition:opacity .12s, transform .12s;
    pointer-events:none;
  }
  .hole.swing .hammerFx{ opacity:1; transform:translateY(4px) rotate(15deg); }
  .hole.shake{ animation:shake .22s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .toast{
    position:absolute; top:8%; left:50%;
    transform:translateX(-50%) scale(.85);
    background:var(--gold); color:#2a1d05; font-weight:800;
    padding:6px 16px; border-radius:999px;
    font-size:clamp(.75rem, 3vw, .95rem);
    opacity:0; pointer-events:none; z-index:5;
    transition:opacity .22s, transform .22s;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) scale(1);}

  .overlay{
    position:absolute; inset:0; z-index:10;
    background:rgba(17,11,35,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:22px; gap:12px;
    overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .overlay h2{font-size:clamp(1.15rem, 5.5vw, 1.7rem); margin:0; color:var(--gold);}
  .overlay p{
    color:var(--text-muted); max-width:36ch; line-height:1.65; margin:0;
    font-size:clamp(.8rem, 3.2vw, .95rem);
  }
  .stars{font-size:clamp(1.8rem, 8vw, 2.4rem); letter-spacing:6px;}
  .primaryBtn{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(.95rem, 4vw, 1.1rem);
    background:var(--gold); color:#2a1d05;
    border:none; border-bottom:4px solid #c99328;
    padding:14px 36px; border-radius:14px; cursor:pointer;
    min-height:52px; margin-top:4px;
  }
  .primaryBtn:active{transform:translateY(3px); border-bottom-width:1px;}
  .sectionLabel{
    font-family:'Space Mono',monospace; color:var(--text-muted);
    font-size:clamp(.6rem, 2.4vw, .7rem); letter-spacing:.04em;
    margin:2px 0 -6px;
  }
  .speedPick{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap; justify-content:center;}
  .speedBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(.8rem, 3.4vw, .95rem);
    background:transparent; color:var(--text-muted);
    border:2px solid #4a3a80; border-radius:999px;
    padding:9px 18px; min-height:44px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .speedBtn.selected{
    background:var(--teal); color:var(--bg-deep); border-color:var(--teal);
  }
  .linkBtn{
    background:none; border:none; color:var(--text-muted);
    font-family:'Baloo 2', sans-serif; font-size:clamp(.75rem, 3vw, .85rem);
    text-decoration:underline; cursor:pointer; padding:6px; min-height:36px;
  }
  .hint{
    font-family:'Space Mono',monospace;
    font-size:clamp(.6rem, 2.4vw, .72rem); color:var(--text-muted);
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="titlebar">
    <h1>🔨 망치 박자 게임</h1>
    <p class="sub" id="subLabel">비트에 맞춰 튀어나오는 두더지를 망치로 콩!</p>
  </div>

  <div class="hud">
    <div class="lives" id="lives"></div>
    <div class="combo" id="comboLabel">콤보 0</div>
    <div class="score" id="scoreLabel">점수 0</div>
  </div>

  <div class="beatBar"><div class="beatDot" id="beatDot"></div></div>

  <div class="arena" id="arena">
    <div class="moleGrid" id="moleGrid"></div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="overlay" id="startOverlay">
    <h2>망치 박자 게임</h2>
    <p>딱, 딱, 딱 — 비트 소리에 맞춰 네 개의 구멍 중 하나에서
    두더지가 튀어나와요. 튀어나온 구멍을 망치로 콩 때려주세요!</p>
    <div class="sectionLabel">박자 빠르기</div>
    <div class="speedPick" id="speedPick">
      <button type="button" class="speedBtn" data-beat="900">느리게</button>
      <button type="button" class="speedBtn selected" data-beat="620">보통</button>
      <button type="button" class="speedBtn" data-beat="440">빠르게</button>
    </div>
    <button class="primaryBtn" id="startBtn">시작하기</button>
    <a class="linkBtn" href="./index.html">♪ 오선보 노트 러시로 가기</a>
    <div class="hint">소리가 나와요 · 무음 모드를 꺼주세요</div>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h2>다시 도전해볼까?</h2>
    <p id="overText"></p>
    <button class="primaryBtn" id="retryBtn">다시 시작</button>
    <button type="button" class="linkBtn" id="menuBtnOver">처음으로</button>
  </div>

  <div class="overlay hidden" id="winOverlay">
    <h2>라운드 클리어!</h2>
    <div class="stars" id="starsLabel"></div>
    <p id="winText"></p>
    <button class="primaryBtn" id="againBtn">한 번 더 하기</button>
    <button type="button" class="linkBtn" id="menuBtnWin">처음으로</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const HOLE_COUNT = 4;
  const TOTAL_BEATS = 32;   // 한 라운드 길이
  const LEAD_IN_BEATS = 2;  // 두더지 없이 박자만 먼저 들려주는 예비 박자

  const el = id => document.getElementById(id);
  const livesEl = el('lives'), comboEl = el('comboLabel'), scoreEl = el('scoreLabel');
  const beatDot = el('beatDot');
  const moleGrid = el('moleGrid');
  const toastEl = el('toast');
  const startOverlay = el('startOverlay'), overOverlay = el('overOverlay'), winOverlay = el('winOverlay');

  // ---------- 구멍 DOM 생성 ----------
  const holes = [];
  for(let i = 0; i < HOLE_COUNT; i++){
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = `<div class="dirt"></div><div class="hammerFx">🔨</div><div class="mole">🐹</div>`;
    const fire = e => {
      e.preventDefault();
      tapHole(i, h);
    };
    h.addEventListener('touchstart', fire, {passive:false});
    h.addEventListener('mousedown', fire);
    moleGrid.appendChild(h);
    holes.push(h);
  }

  // ---------- 사운드 ----------
  let audioCtx = null;
  function initAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    // resume()는 비동기라 완료 전에 소리 함수가 먼저 불려도 상태가 아직
    // 'suspended'일 수 있다 — 아래 사운드 함수들은 audioCtx 존재 여부만
    // 확인하고(state==='running' 강제 체크 없이) 바로 스케줄한다. 그래야
    // resume이 늦게 끝나도 그 소리 자체가 통째로 씹히지 않고 재생된다
    // ("아무 소리도 안 들린다"는 문제의 실제 원인).
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  // 그냥 딱딱거리는 메트로놈 대신, 신나는 멜로디+베이스 루프를 박자마다
  // 같이 연주해서 배경음악처럼 들리게 한다("신나는 멜로디를 넣어서" 피드백
  // 반영). 통통 튀는 8박 루프, 라운드 내내 반복.
  const RIFF_MELODY = [523.25, 659.25, 523.25, 392.00, 440.00, 523.25, 440.00, 329.63];
  const RIFF_BASS   = [130.81, 130.81, 196.00, 196.00, 130.81, 130.81, 196.00, 196.00];
  function playRiffNote(pos){
    if(!audioCtx) return;
    const i = ((pos % RIFF_MELODY.length) + RIFF_MELODY.length) % RIFF_MELODY.length;
    const t0 = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type = 'square'; o1.frequency.value = RIFF_MELODY[i];
    g1.gain.setValueAtTime(0.0001, t0);
    g1.gain.exponentialRampToValueAtTime(0.16, t0 + 0.008);
    g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o1.connect(g1).connect(audioCtx.destination);
    o1.start(t0); o1.stop(t0 + 0.2);

    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = RIFF_BASS[i];
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.13, t0 + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t0); o2.stop(t0 + 0.24);
  }
  function hitSound(){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t0);
    o.frequency.exponentialRampToValueAtTime(220, t0 + 0.1);
    g.gain.setValueAtTime(0.28, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.16);
  }
  function buzz(){
    if(navigator.vibrate) navigator.vibrate(60);
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 110;
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.26);
  }

  // ---------- 박자 빠르기 선택 ----------
  let baseBeatMs = 620;
  let minBeatMs = 620 * 0.55;
  document.querySelectorAll('.speedBtn').forEach(b => {
    const pick = e => {
      e.preventDefault();
      document.querySelectorAll('.speedBtn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      baseBeatMs = parseInt(b.dataset.beat, 10);
      minBeatMs = baseBeatMs * 0.55;
    };
    b.addEventListener('touchstart', pick, {passive:false});
    b.addEventListener('click', pick);
  });

  // ---------- 게임 상태 ----------
  let state, beatTimer = null, beatMs = 620;

  function resetState(){
    state = {
      screen:'start',
      score:0, combo:0, maxCombo:0,
      lives:3, correct:0, misses:0,
      beatIndex:-LEAD_IN_BEATS,
      moleHole:-1, moleResolved:true, lastHole:-1,
      riffPos:0,
    };
    beatMs = baseBeatMs;
  }
  resetState();

  function renderHUD(){
    livesEl.innerHTML = '';
    for(let i = 0; i < 3; i++){
      const s = document.createElement('span');
      s.className = 'heart' + (i < state.lives ? '' : ' off');
      s.textContent = '♥';
      livesEl.appendChild(s);
    }
    comboEl.textContent = `콤보 ${state.combo}`;
    scoreEl.textContent = `점수 ${state.score}`;
  }

  let toastTimer = null;
  function showToast(msg, ms=1100){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function pulseBeatDot(){
    beatDot.classList.add('pulse');
    setTimeout(() => beatDot.classList.remove('pulse'), 110);
  }

  function hideMole(){
    if(state.moleHole >= 0) holes[state.moleHole].classList.remove('up');
  }

  function spawnMole(){
    let hole;
    do { hole = Math.floor(Math.random() * HOLE_COUNT); } while(hole === state.lastHole && HOLE_COUNT > 1);
    state.lastHole = hole;
    state.moleHole = hole;
    state.moleResolved = false;
    holes[hole].classList.add('up');
  }

  function swingHammer(holeEl){
    holeEl.classList.add('swing');
    setTimeout(() => holeEl.classList.remove('swing'), 160);
  }

  function tapHole(i, holeEl){
    swingHammer(holeEl);
    if(state.screen !== 'playing' || state.moleResolved) return;
    if(i === state.moleHole){
      registerHit(holeEl);
    } else {
      holeEl.classList.add('shake');
      setTimeout(() => holeEl.classList.remove('shake'), 220);
    }
  }

  function registerHit(holeEl){
    state.moleResolved = true;
    state.correct++;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    state.score += 10 + Math.min(state.combo, 10) * 2;
    hitSound();
    if(navigator.vibrate) navigator.vibrate(18);
    // "잡힌" 티가 나게 두더지가 통통 튀며 작아지는 애니메이션을 먼저 보여준 뒤
    // 구멍을 원래대로 되돌린다(즉시 슥 사라지면 "잡았다"는 느낌이 안 남).
    holeEl.classList.add('hitGood');
    setTimeout(() => holeEl.classList.remove('hitGood', 'up'), 220);
    if(state.combo > 0 && state.combo % 5 === 0) showToast(`콤보 ${state.combo}! 🔥`);
    maybeSpeedUp();
    renderHUD();
  }

  function registerMiss(){
    state.moleResolved = true;
    const holeEl = holes[state.moleHole];
    hideMole();
    state.combo = 0;
    state.lives--;
    state.misses++;
    buzz();
    holeEl.classList.add('hitMiss');
    setTimeout(() => holeEl.classList.remove('hitMiss'), 250);
    renderHUD();
    if(state.lives <= 0){
      clearInterval(beatTimer);
      gameOver();
    }
  }

  function maybeSpeedUp(){
    if(state.correct > 0 && state.correct % 8 === 0){
      beatMs = Math.max(beatMs * 0.92, minBeatMs);
      clearInterval(beatTimer);
      beatTimer = setInterval(onBeat, beatMs);
      showToast('템포 업! 🔥');
    }
  }

  function onBeat(){
    pulseBeatDot();
    playRiffNote(state.riffPos++);

    // 지난 박자에서 나온 두더지를 아직 못 잡았으면 이번 박자에서 miss 처리.
    if(state.moleHole >= 0 && !state.moleResolved) registerMiss();
    if(state.screen !== 'playing') return; // 방금 gameOver로 바뀌었을 수 있음

    state.beatIndex++;
    if(state.beatIndex >= TOTAL_BEATS){
      clearInterval(beatTimer);
      victory();
      return;
    }
    if(state.beatIndex >= 0) spawnMole();
  }

  function gameOver(){
    state.screen = 'gameover';
    const played = Math.max(state.beatIndex, 0);
    el('overText').textContent =
      `${played}/${TOTAL_BEATS}박자까지 갔어요. 점수 ${state.score}점 · 최대 콤보 ${state.maxCombo}. 다음엔 더 잘할 수 있어요!`;
    overOverlay.classList.remove('hidden');
  }
  function victory(){
    state.screen = 'victory';
    const stars = state.misses === 0 ? 3 : state.misses <= 3 ? 2 : 1;
    el('starsLabel').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    el('winText').textContent =
      `한 라운드를 끝까지 쳤어요! 최종 점수 ${state.score}점, 최대 콤보 ${state.maxCombo}`;
    winOverlay.classList.remove('hidden');
  }

  function startGame(){
    initAudio();
    resetState();
    state.screen = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    holes.forEach(h => h.classList.remove('up','hitGood','hitMiss','shake'));
    renderHUD();
    clearInterval(beatTimer);
    // 첫 박자를 "시작하기"를 누른 직후 바로 재생한다 — 다음 박자까지
    // 620ms 넘게 조용히 기다리게 하지 않고, 탭한 제스처와 최대한 가까이
    // 붙여서 오디오가 확실히 풀리게 한다.
    onBeat();
    beatTimer = setInterval(onBeat, beatMs);
  }
  ['startBtn','retryBtn','againBtn'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, {passive:false});
    b.addEventListener('click', startGame);
  });

  function backToMenu(){
    clearInterval(beatTimer);
    state.screen = 'start';
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }
  ['menuBtnOver','menuBtnWin'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); backToMenu(); }, {passive:false});
    b.addEventListener('click', backToMenu);
  });

  // 백그라운드 전환 시 박자 타이머 정지 → 복귀 시 재개(정확한 누락 박자
  // 복구는 안 하지만, 캐주얼한 연습 게임이라 이 정도면 충분하다).
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      clearInterval(beatTimer);
    } else if(state.screen === 'playing'){
      beatTimer = setInterval(onBeat, beatMs);
    }
  });

  renderHUD();
})();
</script>
</body>
</html>
