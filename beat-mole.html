<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17102B">
<title>망치 박자 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17102B;
    --bg-panel:#221a3f;
    --bg-panel-2:#2c2154;
    --gold:#FFC857;
    --coral:#FF6B6B;
    --teal:#4ECDC4;
    --text-primary:#F4EFFF;
    --text-muted:#b3a6dd;
    --pad: max(10px, env(safe-area-inset-left));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    background:radial-gradient(circle at 50% 0%, #241a46 0%, var(--bg-deep) 70%);
    color:var(--text-primary);
    font-family:'Baloo 2', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:
      max(6px, env(safe-area-inset-top))
      var(--pad)
      max(6px, env(safe-area-inset-bottom))
      var(--pad);
    -webkit-user-select:none; user-select:none;
  }

  .stage{
    width:100%;
    max-width:820px;
    height:100%;
    max-height:900px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:2px solid #3d2f70;
    border-radius:18px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    padding:10px 12px 12px;
    display:flex; flex-direction:column; gap:8px;
    position:relative; overflow:hidden;
  }

  .titlebar{display:flex; align-items:baseline; gap:8px; flex-shrink:0;}
  h1{
    font-size:clamp(.95rem, 3.6vw, 1.35rem);
    margin:0; color:var(--gold); letter-spacing:.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:clamp(.62rem, 2.2vw, .8rem);
    margin:0;
  }
  @media (max-height:620px){ .sub{display:none;} }

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace;
    font-size:clamp(.72rem, 2.8vw, .95rem);
    flex-shrink:0;
  }
  .lives{display:flex; gap:3px; font-size:1.15em;}
  .heart{transition:opacity .25s, transform .25s; display:inline-block;}
  .heart.off{opacity:.16; transform:scale(.8);}
  .heart.lost{ animation:heartShake .5s ease-out; }
  @keyframes heartShake{
    0%{ transform:scale(1.4) rotate(0); opacity:1; }
    25%{ transform:scale(1.3) rotate(-14deg); }
    50%{ transform:scale(1.2) rotate(12deg); }
    75%{ transform:scale(1) rotate(-6deg); }
    100%{ transform:scale(.8) rotate(0); opacity:.16; }
  }
  .combo{color:var(--coral); font-weight:700; display:inline-block;}
  .combo.bump{ animation:comboBump .28s ease-out; }
  @keyframes comboBump{ 0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1);} }
  .score{color:var(--teal);}

  .beatBar{display:flex; justify-content:center; align-items:center; gap:8px; flex-shrink:0;}
  .beatInfo{
    font-family:'Space Mono',monospace; color:var(--text-muted);
    font-size:clamp(.66rem, 2.6vw, .82rem); letter-spacing:.02em;
  }
  .beatDot{
    width:12px; height:12px; border-radius:50%;
    background:var(--teal); transition:transform .09s ease-out, background .09s ease-out, box-shadow .09s ease-out;
  }
  /* 4박마다 오는 첫 박(리프의 강박)은 더 크게·금색 — 마디 감각이 눈으로도 잡힌다 */
  .beatDot.pulse{ transform:scale(1.4); background:#7fe3dc; }
  .beatDot.pulse.strong{ transform:scale(1.9); background:var(--gold); box-shadow:0 0 12px 3px rgba(255,200,87,.5); }
  .progressBar{
    height:5px; border-radius:3px; background:#150e29; border:1px solid #40315f;
    overflow:hidden; flex-shrink:0;
  }
  .progressFill{
    height:100%; width:0%;
    background:linear-gradient(90deg, var(--teal), var(--gold));
    transition:width .12s linear;
  }

  .arena{
    position:relative; flex:1 1 auto; min-height:160px;
  }
  .moleGrid{
    position:absolute; inset:0;
    display:grid; grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(2, 1fr);
    gap:10px;
  }
  .hole{
    position:relative;
    background:radial-gradient(ellipse at 50% 100%, #1c1238 0%, #150e29 60%);
    border:2px solid #40315f; border-radius:18px;
    overflow:hidden; cursor:pointer; touch-action:manipulation;
    display:flex; align-items:flex-end; justify-content:center;
    transition:border-color .12s, box-shadow .12s;
  }
  /* 두더지가 올라와 있는 구멍은 테두리가 살짝 밝아져서 어디를 봐야 할지 더 빨리 잡힌다 */
  .hole.up{ border-color:#6b56b3; box-shadow:0 0 0 1px rgba(255,200,87,.15), inset 0 0 22px rgba(255,200,87,.08); }
  .hole .dirt{
    position:absolute; bottom:0; left:8%; right:8%; height:26%;
    background:linear-gradient(180deg, #3a2b6b 0%, #2c2154 55%);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    box-shadow:0 -3px 8px rgba(0,0,0,.35);
  }
  .hole .dirt::before{
    content:''; position:absolute; left:14%; right:14%; top:-7%; height:24%;
    background:#0d0820; border-radius:50%; opacity:.9;
  }
  /* 두더지가 올라와 있는 동안 남은 시간이 줄어드는 막대 — 언제까지 때려야 하는지 보인다 */
  .hole .timerBar{
    position:absolute; left:10%; right:10%; bottom:6px; height:5px;
    border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; opacity:0;
    transition:opacity .1s;
  }
  .hole .timerBar::after{
    content:''; position:absolute; inset:0; transform-origin:left center;
    background:linear-gradient(90deg, var(--gold), var(--coral));
    transform:scaleX(0);
  }
  .hole.up .timerBar{ opacity:1; }
  .hole.up .timerBar::after{ animation:timerDrain var(--beat-ms, 620ms) linear forwards; }
  @keyframes timerDrain{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
  .mole{
    position:absolute; bottom:-70%; left:50%; transform:translateX(-50%);
    font-size:clamp(2.1rem, 11vw, 3.4rem); line-height:1;
    transition:bottom .12s cubic-bezier(.34,1.4,.64,1);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }
  .hole.up .mole{ bottom:14%; animation:moleWiggle .6s ease-in-out .12s infinite alternate; }
  @keyframes moleWiggle{ from{ transform:translateX(-50%) rotate(-6deg); } to{ transform:translateX(-50%) rotate(6deg); } }
  .hole.hitGood{ background:rgba(255,200,87,.14); border-color:var(--gold); }
  .hole.hitGood .timerBar{ opacity:0; }
  .starFx{
    position:absolute; left:50%; top:45%; pointer-events:none;
    font-size:clamp(.9rem, 4vw, 1.3rem); line-height:1;
    transform:translate(-50%,-50%);
    animation:starFly .55s ease-out forwards;
  }
  @keyframes starFly{
    0%{ transform:translate(-50%,-50%) scale(.4); opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity:0; }
  }
  .scorePop{
    position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); pointer-events:none;
    font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--gold);
    font-size:clamp(.95rem, 4vw, 1.3rem); text-shadow:0 2px 6px rgba(0,0,0,.6);
    animation:scoreRise .8s ease-out forwards; z-index:2;
  }
  @keyframes scoreRise{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.6); }
    20%{ opacity:1; transform:translate(-50%,-70%) scale(1.15); }
    100%{ opacity:0; transform:translate(-50%,-170%) scale(1); }
  }
  .missVignette{
    position:absolute; inset:-2px; pointer-events:none; z-index:3; border-radius:18px;
    box-shadow:inset 0 0 40px 10px rgba(255,107,107,.55);
    opacity:0; transition:opacity .4s ease-out;
  }
  .missVignette.show{ opacity:1; transition:none; }
  .countdown{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--gold);
    font-size:clamp(2.6rem, 16vw, 5rem);
    text-shadow:0 4px 14px rgba(0,0,0,.6);
    pointer-events:none; opacity:0; transform:scale(.6);
    transition:opacity .12s ease-out, transform .12s ease-out; z-index:4;
  }
  .countdown.show{ opacity:1; transform:scale(1); }
  .countdown.go{ color:var(--teal); font-size:clamp(2rem, 11vw, 3.4rem); }
  .stageDots{ display:flex; gap:8px; align-items:center; }
  .stageDot{
    width:11px; height:11px; border-radius:50%; background:#4a3a80;
    border:2px solid #4a3a80;
  }
  .stageDot.done{ background:var(--teal); border-color:var(--teal); }
  .stageDot.cur{ background:var(--gold); border-color:var(--gold); box-shadow:0 0 8px rgba(255,200,87,.6); }
  @media (prefers-reduced-motion: reduce){
    .hole.up .mole{ animation:none; }
    .starFx{ animation-duration:.25s; }
  }
  .hole.hitGood .mole{ animation:caughtPop .24s ease-out forwards; }
  @keyframes caughtPop{
    0%{ transform:translateX(-50%) scale(1) rotate(0); }
    40%{ transform:translateX(-50%) scale(1.35) rotate(-10deg); }
    100%{ transform:translateX(-50%) scale(.2) rotate(8deg); opacity:0; }
  }
  .hole.hitMiss{ background:rgba(255,107,107,.16); border-color:var(--coral); }
  .hammerFx{
    position:absolute; top:6%; font-size:clamp(1.7rem, 8vw, 2.6rem);
    opacity:0; transform:translateY(-16px) rotate(-35deg);
    transition:opacity .12s, transform .12s;
    pointer-events:none;
  }
  .hole.swing .hammerFx{ opacity:1; transform:translateY(4px) rotate(15deg); }
  .hole.shake{ animation:shake .22s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .toast{
    position:absolute; top:8%; left:50%;
    transform:translateX(-50%) scale(.85);
    background:var(--gold); color:#2a1d05; font-weight:800;
    padding:6px 16px; border-radius:999px;
    font-size:clamp(.75rem, 3vw, .95rem);
    opacity:0; pointer-events:none; z-index:5;
    transition:opacity .22s, transform .22s;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) scale(1);}

  .overlay{
    position:absolute; inset:0; z-index:10;
    background:rgba(17,11,35,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:22px; gap:12px;
    overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .overlay h2{font-size:clamp(1.15rem, 5.5vw, 1.7rem); margin:0; color:var(--gold);}
  .overlay p{
    color:var(--text-muted); max-width:36ch; line-height:1.65; margin:0;
    font-size:clamp(.8rem, 3.2vw, .95rem);
  }
  .stars{font-size:clamp(1.8rem, 8vw, 2.4rem); letter-spacing:6px;}
  .primaryBtn{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(.95rem, 4vw, 1.1rem);
    background:var(--gold); color:#2a1d05;
    border:none; border-bottom:4px solid #c99328;
    padding:14px 36px; border-radius:14px; cursor:pointer;
    min-height:52px; margin-top:4px;
  }
  .primaryBtn:active{transform:translateY(3px); border-bottom-width:1px;}
  .sectionLabel{
    font-family:'Space Mono',monospace; color:var(--text-muted);
    font-size:clamp(.6rem, 2.4vw, .7rem); letter-spacing:.04em;
    margin:2px 0 -6px;
  }
  .speedPick{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap; justify-content:center;}
  .speedBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(.8rem, 3.4vw, .95rem);
    background:transparent; color:var(--text-muted);
    border:2px solid #4a3a80; border-radius:999px;
    padding:9px 18px; min-height:44px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .speedBtn.selected{
    background:var(--teal); color:var(--bg-deep); border-color:var(--teal);
  }
  .linkBtn{
    background:none; border:none; color:var(--text-muted);
    font-family:'Baloo 2', sans-serif; font-size:clamp(.75rem, 3vw, .85rem);
    text-decoration:underline; cursor:pointer; padding:6px; min-height:36px;
  }
  .hint{
    font-family:'Space Mono',monospace;
    font-size:clamp(.6rem, 2.4vw, .72rem); color:var(--text-muted);
  }
  .hidden{ display:none !important; }

  .rankEntry{ display:flex; flex-direction:column; gap:8px; align-items:center; margin-top:2px; width:100%; }
  .rankInput{
    font-family:'Baloo 2', sans-serif; font-size:clamp(.85rem, 3.4vw, 1rem);
    background:#150e29; border:2px solid #4a3a80; border-radius:10px;
    color:var(--text-primary); padding:8px 12px; text-align:center;
    width:min(220px, 80vw);
  }
  .rankInput:focus{ outline:none; border-color:var(--teal); }
  .rankEntryBtns{ display:flex; gap:8px; }
  .miniBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(.75rem, 3vw, .88rem);
    background:var(--teal); color:var(--bg-deep); border:none;
    border-radius:999px; padding:8px 16px; cursor:pointer; min-height:38px;
  }
  .miniBtn.ghost{ background:transparent; color:var(--text-muted); border:2px solid #4a3a80; }
  .rankSaved{ color:var(--gold); font-weight:700; font-size:clamp(.78rem, 3vw, .9rem); }

  .rankList{
    list-style:none; padding:0; margin:0; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:6px; text-align:left;
    max-height:50vh; overflow-y:auto;
  }
  .rankList li{
    display:flex; align-items:center; gap:10px;
    background:#150e29; border:1px solid #40315f; border-radius:10px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:clamp(.78rem, 3vw, .9rem);
  }
  .rankNum{ color:var(--gold); font-weight:700; width:1.6em; flex-shrink:0; }
  .rankName{ flex:1; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rankScore{ color:var(--teal); font-weight:700; flex-shrink:0; }
  .rankEmpty{ color:var(--text-muted); text-align:center; list-style:none; padding:8px; }

</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="titlebar">
    <h1>🔨 망치 박자 게임</h1>
    <p class="sub" id="subLabel">비트에 맞춰 튀어나오는 두더지를 망치로 콩!</p>
  </div>

  <div class="hud">
    <div class="lives" id="lives"></div>
    <div class="combo" id="comboLabel">콤보 0</div>
    <div class="score" id="scoreLabel">점수 0</div>
  </div>

  <div class="beatBar">
    <div class="beatDot" id="beatDot"></div>
    <div class="beatInfo" id="beatInfo">BPM – · 스테이지 –</div>
  </div>
  <div class="progressBar"><div class="progressFill" id="progressFill"></div></div>

  <div class="arena" id="arena">
    <div class="moleGrid" id="moleGrid"></div>
    <div class="missVignette" id="missVignette"></div>
    <div class="toast" id="toast"></div>
    <div class="countdown" id="countdownEl"></div>
  </div>

  <div class="overlay" id="startOverlay">
    <h2>망치 박자 게임</h2>
    <p>딱, 딱, 딱 — 비트 소리에 맞춰 네 개의 구멍 중 하나에서
    두더지가 튀어나와요. 튀어나온 구멍을 망치로 콩 때려주세요!</p>
    <div class="sectionLabel">박자 빠르기</div>
    <div class="speedPick" id="speedPick">
      <button type="button" class="speedBtn" data-beat="900">느리게</button>
      <button type="button" class="speedBtn selected" data-beat="620">보통</button>
      <button type="button" class="speedBtn" data-beat="440">빠르게</button>
    </div>
    <button class="primaryBtn" id="startBtn">시작하기</button>
    <a class="linkBtn" href="./index.html">♪ 오선보 노트 러시로 가기</a>
    <a class="linkBtn" href="./fireworks.html">🎆 리듬 불꽃놀이로 가기</a>
    <button type="button" class="linkBtn" id="viewRankBtn">🏆 랭킹 보기</button>
    <div class="hint">소리가 나와요 · 무음 모드를 꺼주세요</div>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h2>다시 도전해볼까?</h2>
    <div class="stageDots" id="stageDotsOver"></div>
    <p id="overText"></p>
    <div class="rankEntry" id="rankEntryOver">
      <div class="rankForm" id="rankFormOver">
        <input type="text" class="rankInput" id="rankNameOver" placeholder="이름(최대 12자)" maxlength="12">
        <div class="rankEntryBtns">
          <button type="button" class="miniBtn" id="rankSubmitOver">랭킹 등록</button>
          <button type="button" class="miniBtn ghost" id="rankSkipOver">건너뛰기</button>
        </div>
      </div>
      <div class="rankSaved hidden" id="rankSavedOver">✅ 랭킹에 등록됐어요!</div>
    </div>
    <button class="primaryBtn" id="retryBtn">다시 시작</button>
    <button type="button" class="linkBtn" id="menuBtnOver">처음으로</button>
  </div>

  <div class="overlay hidden" id="winOverlay">
    <h2 id="winHeading">라운드 클리어!</h2>
    <div class="stars" id="starsLabel"></div>
    <div class="stageDots" id="stageDotsWin"></div>
    <p id="winText"></p>
    <div class="rankEntry" id="rankEntryWin">
      <div class="rankForm" id="rankFormWin">
        <input type="text" class="rankInput" id="rankNameWin" placeholder="이름(최대 12자)" maxlength="12">
        <div class="rankEntryBtns">
          <button type="button" class="miniBtn" id="rankSubmitWin">랭킹 등록</button>
          <button type="button" class="miniBtn ghost" id="rankSkipWin">건너뛰기</button>
        </div>
      </div>
      <div class="rankSaved hidden" id="rankSavedWin">✅ 랭킹에 등록됐어요!</div>
    </div>
    <button class="primaryBtn" id="againBtn">한 번 더 하기</button>
    <button type="button" class="linkBtn" id="menuBtnWin">처음으로</button>
  </div>

  <div class="overlay hidden" id="rankOverlay">
    <h2>🏆 랭킹 TOP 10</h2>
    <ol class="rankList" id="rankingList"></ol>
    <button type="button" class="linkBtn" id="closeRankBtn">닫기</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const HOLE_COUNT = 4;
  const LEAD_IN_BEATS = 2;  // 두더지 없이 박자만 먼저 들려주는 예비 박자

  // 스테이지가 올라갈수록 라운드가 길어지고 박자가 빨라진다("스테이지
  // 늘려줘" 피드백 반영). 배속(factor)은 시작 화면에서 고른 기본 박자에
  // 곱해지는 값이라, "느리게/보통/빠르게"를 고른 상태에서도 스테이지 진행에
  // 따라 똑같은 비율로 계속 빨라진다.
  const STAGES = [
    { beats:20, factor:1.00 },
    { beats:24, factor:0.88 },
    { beats:28, factor:0.78 },
    { beats:32, factor:0.68 },
    { beats:36, factor:0.58 },
  ];
  const MIN_BEAT_MS = 260;

  // BPM에 대응하는 이탈리아어 빠르기말(음악 용어) — 클래식 악보에서 쓰는
  // 표준 구간표 그대로.
  const TEMPO_TERMS = [
    [0, 19, 'Larghissimo'], [20, 39, 'Grave'], [40, 44, 'Lento'], [45, 49, 'Largo'],
    [50, 54, 'Larghetto'], [55, 64, 'Adagio'], [65, 68, 'Adagietto'], [69, 72, 'Andante moderato'],
    [73, 77, 'Andante'], [78, 82, 'Andantino'], [83, 85, 'Marcia moderato'], [86, 97, 'Moderato'],
    [98, 109, 'Allegretto'], [110, 131, 'Allegro'], [132, 139, 'Vivace'], [140, 149, 'Vivacissimo'],
    [150, 167, 'Allegrissimo'], [168, 177, 'Presto'], [178, Infinity, 'Prestissimo'],
  ];
  function tempoTermForBpm(bpm){
    for(const [lo, hi, term] of TEMPO_TERMS){
      if(bpm >= lo && bpm <= hi) return term;
    }
    return '';
  }

  const el = id => document.getElementById(id);
  const livesEl = el('lives'), comboEl = el('comboLabel'), scoreEl = el('scoreLabel');
  const beatDot = el('beatDot'), beatInfoEl = el('beatInfo');
  const moleGrid = el('moleGrid');
  const toastEl = el('toast');
  const startOverlay = el('startOverlay'), overOverlay = el('overOverlay'), winOverlay = el('winOverlay');
  const rankOverlay = el('rankOverlay');

  // ---------- 랭킹(이 기기/브라우저에만 저장) ----------
  const RANKING_KEY = 'beatMoleRanking_v1';
  const RANKING_MAX = 10;
  function loadRanking(){
    try {
      const raw = localStorage.getItem(RANKING_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch(e){ return []; }
  }
  function addRankingEntry(name, score){
    const list = loadRanking();
    list.push({ name: (name || '이름없음').slice(0, 12), score, date: new Date().toISOString().slice(0, 10) });
    list.sort((a, b) => b.score - a.score);
    list.length = Math.min(list.length, RANKING_MAX);
    try { localStorage.setItem(RANKING_KEY, JSON.stringify(list)); } catch(e){}
  }
  function renderRankingList(){
    const list = loadRanking();
    const listEl = el('rankingList');
    listEl.innerHTML = '';
    if(list.length === 0){
      const li = document.createElement('li');
      li.className = 'rankEmpty';
      li.textContent = '아직 등록된 기록이 없어요.';
      listEl.appendChild(li);
      return;
    }
    list.forEach((r, i) => {
      const li = document.createElement('li');
      const num = document.createElement('span'); num.className = 'rankNum'; num.textContent = `${i + 1}`;
      const name = document.createElement('span'); name.className = 'rankName'; name.textContent = r.name;
      const score = document.createElement('span'); score.className = 'rankScore'; score.textContent = `${r.score}점`;
      li.append(num, name, score);
      listEl.appendChild(li);
    });
  }
  // overOverlay/winOverlay에 각각 붙는 "이름 입력 → 랭킹 등록/건너뛰기" 미니 폼.
  // 라운드가 끝날 때마다 resetRankEntry*()로 새 폼 상태로 되돌려준다.
  function setupRankEntry(prefix, getScore){
    const form = el('rankForm' + prefix);
    const saved = el('rankSaved' + prefix);
    const input = el('rankName' + prefix);
    const submit = () => {
      addRankingEntry(input.value.trim(), getScore());
      form.classList.add('hidden');
      saved.classList.remove('hidden');
    };
    const skip = () => {
      form.classList.add('hidden');
      saved.classList.add('hidden');
    };
    const submitBtn = el('rankSubmit' + prefix), skipBtn = el('rankSkip' + prefix);
    submitBtn.addEventListener('touchstart', e => { e.preventDefault(); submit(); }, {passive:false});
    submitBtn.addEventListener('click', submit);
    skipBtn.addEventListener('touchstart', e => { e.preventDefault(); skip(); }, {passive:false});
    skipBtn.addEventListener('click', skip);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    return () => {
      form.classList.remove('hidden');
      saved.classList.add('hidden');
      input.value = '';
    };
  }
  const resetRankEntryOver = setupRankEntry('Over', () => state.score);
  const resetRankEntryWin = setupRankEntry('Win', () => state.score);

  const viewRankBtn = el('viewRankBtn'), closeRankBtn = el('closeRankBtn');
  const openRanking = e => {
    if(e) e.preventDefault();
    renderRankingList();
    startOverlay.classList.add('hidden');
    rankOverlay.classList.remove('hidden');
  };
  const closeRanking = e => {
    if(e) e.preventDefault();
    rankOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  };
  viewRankBtn.addEventListener('touchstart', openRanking, {passive:false});
  viewRankBtn.addEventListener('click', openRanking);
  closeRankBtn.addEventListener('touchstart', closeRanking, {passive:false});
  closeRankBtn.addEventListener('click', closeRanking);

  // ---------- 구멍 DOM 생성 ----------
  const holes = [];
  for(let i = 0; i < HOLE_COUNT; i++){
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = `<div class="dirt"></div><div class="mole">🐹</div><div class="timerBar"></div><div class="hammerFx">🔨</div>`;
    const fire = e => {
      e.preventDefault();
      tapHole(i, h);
    };
    h.addEventListener('touchstart', fire, {passive:false});
    h.addEventListener('mousedown', fire);
    moleGrid.appendChild(h);
    holes.push(h);
  }

  // ---------- 사운드 ----------
  // 정답/오답 효과음은 오실레이터로 합성한 "삐빅" 소리 대신 실제 무료
  // 라이선스 효과음 샘플을 쓴다(Mixkit 무료 SFX, 별도 저작자 표시 불필요 —
  // sounds/ 폴더 참고). 못 불러온 경우에만 기존 합성음으로 조용히 대체된다.
  // 박자 리듬(playRiffNote)은 실제 멜로디라 그대로 합성음 유지.
  const SOUND_FILES = { catch: 'sounds/catch.mp3', buzzer: 'sounds/buzzer.mp3' };
  const soundBuffers = {};
  let audioCtx = null;
  function loadSounds(){
    if(!audioCtx || typeof fetch !== 'function') return;
    Object.entries(SOUND_FILES).forEach(([name, url]) => {
      if(soundBuffers[name]) return;
      try {
        fetch(url)
          .then(r => r.arrayBuffer())
          .then(buf => audioCtx.decodeAudioData(buf))
          .then(decoded => { soundBuffers[name] = decoded; })
          .catch(() => {}); // 네트워크 실패/디코딩 실패 시 조용히 무시 -> 합성음 폴백
      } catch(e) {} // fetch 자체가 없거나 동기적으로 던지는 환경 방어
    });
  }
  function playSample(name, gainValue){
    const buffer = soundBuffers[name];
    if(!audioCtx || !buffer) return false;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const g = audioCtx.createGain();
    g.gain.value = gainValue;
    src.connect(g).connect(audioCtx.destination);
    src.start();
    return true;
  }
  function initAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    // resume()는 비동기라 완료 전에 소리 함수가 먼저 불려도 상태가 아직
    // 'suspended'일 수 있다 — 아래 사운드 함수들은 audioCtx 존재 여부만
    // 확인하고(state==='running' 강제 체크 없이) 바로 스케줄한다. 그래야
    // resume이 늦게 끝나도 그 소리 자체가 통째로 씹히지 않고 재생된다
    // ("아무 소리도 안 들린다"는 문제의 실제 원인).
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    loadSounds();
  }

  // 그냥 딱딱거리는 메트로놈 대신, 신나는 멜로디+베이스 루프를 박자마다
  // 같이 연주해서 배경음악처럼 들리게 한다("신나는 멜로디를 넣어서" 피드백
  // 반영). 통통 튀는 8박 루프, 라운드 내내 반복.
  const RIFF_MELODY = [523.25, 659.25, 523.25, 392.00, 440.00, 523.25, 440.00, 329.63];
  const RIFF_BASS   = [130.81, 130.81, 196.00, 196.00, 130.81, 130.81, 196.00, 196.00];
  function playRiffNote(pos){
    if(!audioCtx) return;
    const i = ((pos % RIFF_MELODY.length) + RIFF_MELODY.length) % RIFF_MELODY.length;
    const t0 = audioCtx.currentTime;
    const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type = 'square'; o1.frequency.value = RIFF_MELODY[i];
    g1.gain.setValueAtTime(0.0001, t0);
    g1.gain.exponentialRampToValueAtTime(0.16, t0 + 0.008);
    g1.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o1.connect(g1).connect(audioCtx.destination);
    o1.start(t0); o1.stop(t0 + 0.2);

    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = 'sine'; o2.frequency.value = RIFF_BASS[i];
    g2.gain.setValueAtTime(0.0001, t0);
    g2.gain.exponentialRampToValueAtTime(0.13, t0 + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t0); o2.stop(t0 + 0.24);
  }
  function hitSound(){
    if(playSample('catch', 0.7)) return;
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t0);
    o.frequency.exponentialRampToValueAtTime(220, t0 + 0.1);
    g.gain.setValueAtTime(0.28, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.16);
  }
  function buzz(){
    if(navigator.vibrate) navigator.vibrate(60);
    if(playSample('buzzer', 0.5)) return;
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 110;
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.26);
  }

  // ---------- 박자 빠르기 선택 ----------
  let baseBeatMs = 620;
  document.querySelectorAll('.speedBtn').forEach(b => {
    const pick = e => {
      e.preventDefault();
      document.querySelectorAll('.speedBtn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      baseBeatMs = parseInt(b.dataset.beat, 10);
    };
    b.addEventListener('touchstart', pick, {passive:false});
    b.addEventListener('click', pick);
  });
  function beatMsForStage(idx){
    return Math.max(Math.round(baseBeatMs * STAGES[idx].factor), MIN_BEAT_MS);
  }

  // ---------- 게임 상태 ----------
  let state, beatTimer = null, beatMs = 620, nextBeatAt = 0;

  // setInterval(onBeat, beatMs)는 매 콜백이 "이전 콜백 실행이 끝난 시점"부터
  // 다시 beatMs를 세기 때문에, DOM 조작 등으로 콜백 하나가 몇 ms만 늦게
  // 끝나도 그 지연이 다음 박자로 그대로 누적된다 — 라운드가 길어질수록
  // 점점 밀리는 "엇박" 느낌의 실제 원인. nextBeatAt에 절대 목표 시각을
  // 잡아두고 setTimeout 지연을 매번 그 시각까지 남은 만큼만 주면, 콜백
  // 하나가 늦게 끝나도 다음 박자가 그만큼 앞당겨 보정되어 드리프트가
  // 쌓이지 않는다.
  function scheduleBeat(){
    const delay = Math.max(0, nextBeatAt - performance.now());
    beatTimer = setTimeout(() => {
      nextBeatAt += beatMs;
      onBeat();
      if(state.screen === 'playing') scheduleBeat();
    }, delay);
  }

  function updateBeatInfo(){
    const bpm = Math.round(60000 / beatMs);
    const term = tempoTermForBpm(bpm);
    const beatNum = Math.max(state.beatIndex, 0);
    beatInfoEl.textContent =
      `BPM ${bpm} (${term}) · 스테이지 ${state.stageIndex + 1}/${STAGES.length} · ${beatNum}/${state.totalBeats}박자`;
    el('progressFill').style.width = state.totalBeats ? (beatNum / state.totalBeats * 100) + '%' : '0%';
  }
  // clearedCurrent: 지금 스테이지를 방금 깬 화면(클리어)이면 그 점도 완료 색으로.
  function renderStageDots(container, clearedCurrent){
    container.innerHTML = '';
    const doneUpTo = clearedCurrent ? state.stageIndex : state.stageIndex - 1;
    STAGES.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'stageDot' + (i <= doneUpTo ? ' done' : i === state.stageIndex ? ' cur' : '');
      d.title = `스테이지 ${i + 1}`;
      container.appendChild(d);
    });
  }
  let countdownTimer = null;
  function showCountdown(text, isGo){
    const c = el('countdownEl');
    c.textContent = text;
    c.classList.toggle('go', !!isGo);
    c.classList.remove('show');
    void c.offsetWidth;
    c.classList.add('show');
    clearTimeout(countdownTimer);
    countdownTimer = setTimeout(() => c.classList.remove('show'), isGo ? 500 : Math.min(600, beatMs * 0.9));
  }

  // score/maxCombo 등은 스테이지를 넘어가도 계속 누적되는 세션 전체 값이고,
  // lives/beatIndex/두더지 상태는 스테이지가 바뀔 때마다 startStage()에서
  // 새로 초기화된다.
  function resetState(){
    state = {
      screen:'start',
      score:0, combo:0, maxCombo:0,
      lives:3, misses:0,
      stageIndex:0, totalBeats:STAGES[0].beats,
      beatIndex:-LEAD_IN_BEATS,
      moleHole:-1, moleResolved:true, lastHole:-1,
      riffPos:0,
    };
    beatMs = beatMsForStage(0);
  }
  resetState();

  // lostIndex: 방금 잃은 하트 자리 — 그 하트만 흔들리며 꺼진다.
  function renderHUD(lostIndex = -1){
    livesEl.innerHTML = '';
    for(let i = 0; i < 3; i++){
      const s = document.createElement('span');
      s.className = 'heart' + (i < state.lives ? '' : ' off') + (i === lostIndex ? ' lost' : '');
      s.textContent = '♥';
      livesEl.appendChild(s);
    }
    comboEl.textContent = `콤보 ${state.combo}`;
    scoreEl.textContent = `점수 ${state.score}`;
  }
  function bumpCombo(){
    comboEl.classList.remove('bump');
    void comboEl.offsetWidth;
    comboEl.classList.add('bump');
  }
  let vignetteTimer = null;
  function missFlash(){
    const v = el('missVignette');
    v.classList.add('show');
    clearTimeout(vignetteTimer);
    vignetteTimer = setTimeout(() => v.classList.remove('show'), 60);
  }
  function spawnFx(holeEl, gained){
    const pop = document.createElement('div');
    pop.className = 'scorePop';
    pop.textContent = `+${gained}`;
    holeEl.appendChild(pop);
    setTimeout(() => pop.remove(), 850);
    const stars = ['⭐', '✨', '💫', '⭐', '✨'];
    stars.forEach((ch, i) => {
      const s = document.createElement('div');
      s.className = 'starFx';
      s.textContent = ch;
      const ang = (-Math.PI * 0.9) + (i / (stars.length - 1)) * Math.PI * 0.8; // 위쪽 부채꼴
      const dist = 34 + Math.random() * 22;
      s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      s.style.setProperty('--rot', (Math.random() * 90 - 45) + 'deg');
      holeEl.appendChild(s);
      setTimeout(() => s.remove(), 600);
    });
  }

  let toastTimer = null;
  function showToast(msg, ms=1100){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function pulseBeatDot(strong){
    beatDot.classList.add('pulse');
    beatDot.classList.toggle('strong', !!strong);
    setTimeout(() => beatDot.classList.remove('pulse', 'strong'), 110);
  }

  function hideMole(){
    if(state.moleHole >= 0) holes[state.moleHole].classList.remove('up');
  }

  function spawnMole(){
    let hole;
    do { hole = Math.floor(Math.random() * HOLE_COUNT); } while(hole === state.lastHole && HOLE_COUNT > 1);
    state.lastHole = hole;
    state.moleHole = hole;
    state.moleResolved = false;
    holes[hole].classList.add('up');
  }

  function swingHammer(holeEl){
    holeEl.classList.add('swing');
    setTimeout(() => holeEl.classList.remove('swing'), 160);
  }

  function tapHole(i, holeEl){
    swingHammer(holeEl);
    if(state.screen !== 'playing' || state.moleResolved) return;
    if(i === state.moleHole){
      registerHit(holeEl);
    } else {
      registerWrongTap(holeEl);
    }
  }

  // 엉뚱한 구멍을 때리면 생명이 깎인다 — 이게 없으면 4칸을 그냥 다 눌러버려도
  // 정답 구멍이 그 안에 포함되니 매번 성공해버리는 문제가 있었다("4칸을 막
  // 터치하고 있으면 스테이지가 성공하는" 버그 리포트).
  function registerWrongTap(holeEl){
    state.combo = 0;
    state.lives--;
    state.misses++;
    buzz();
    missFlash();
    holeEl.classList.add('shake');
    setTimeout(() => holeEl.classList.remove('shake'), 220);
    renderHUD(state.lives);
    if(state.lives <= 0){
      state.moleResolved = true;
      hideMole();
      clearTimeout(beatTimer);
      gameOver();
    }
  }

  function registerHit(holeEl){
    state.moleResolved = true;
    state.combo++;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const gained = 10 + Math.min(state.combo, 10) * 2;
    state.score += gained;
    hitSound();
    if(navigator.vibrate) navigator.vibrate(18);
    // "잡힌" 티가 나게 두더지가 통통 튀며 작아지는 애니메이션을 먼저 보여준 뒤
    // 구멍을 원래대로 되돌린다(즉시 슥 사라지면 "잡았다"는 느낌이 안 남).
    holeEl.classList.add('hitGood');
    setTimeout(() => holeEl.classList.remove('hitGood', 'up'), 220);
    spawnFx(holeEl, gained);
    if(state.combo > 0 && state.combo % 5 === 0) showToast(`콤보 ${state.combo}! 🔥`);
    renderHUD();
    bumpCombo();
  }

  function registerMiss(){
    state.moleResolved = true;
    const holeEl = holes[state.moleHole];
    hideMole();
    state.combo = 0;
    state.lives--;
    state.misses++;
    buzz();
    missFlash();
    holeEl.classList.add('hitMiss');
    setTimeout(() => holeEl.classList.remove('hitMiss'), 250);
    renderHUD(state.lives);
    if(state.lives <= 0){
      clearTimeout(beatTimer);
      gameOver();
    }
  }

  function onBeat(){
    // 리프는 4박 단위로 강박이 돌아온다(RIFF_BASS 패턴 기준) — 그 박만 크게 표시.
    pulseBeatDot(state.riffPos % 4 === 0);
    playRiffNote(state.riffPos++);

    // 지난 박자에서 나온 두더지를 아직 못 잡았으면 이번 박자에서 miss 처리.
    if(state.moleHole >= 0 && !state.moleResolved) registerMiss();
    if(state.screen !== 'playing') return; // 방금 gameOver로 바뀌었을 수 있음

    state.beatIndex++;
    if(state.beatIndex >= state.totalBeats){
      clearTimeout(beatTimer);
      victory();
      return;
    }
    updateBeatInfo();
    if(state.beatIndex >= 0){
      if(state.beatIndex === 0) showCountdown('시작!', true);
      spawnMole();
    } else {
      // 예비 박자(두더지 없는 한 박) 동안 "준비"를 크게 보여줘서 첫 두더지가
      // 바로 다음 박에 나온다는 걸 미리 알 수 있게.
      showCountdown('준비');
    }
  }

  function gameOver(){
    state.screen = 'gameover';
    const played = Math.max(state.beatIndex, 0);
    el('overText').textContent =
      `스테이지 ${state.stageIndex + 1}, ${played}/${state.totalBeats}박자까지 갔어요. ` +
      `점수 ${state.score}점 · 최대 콤보 ${state.maxCombo}. 다음엔 더 잘할 수 있어요!`;
    onAgain = () => startStage(state.stageIndex);
    el('retryBtn').textContent = '이 스테이지 다시';
    renderStageDots(el('stageDotsOver'), false);
    resetRankEntryOver();
    overOverlay.classList.remove('hidden');
  }
  function victory(){
    state.screen = 'victory';
    const stars = state.misses === 0 ? 3 : state.misses <= 1 ? 2 : 1;
    el('starsLabel').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    renderStageDots(el('stageDotsWin'), true);
    const isLast = state.stageIndex >= STAGES.length - 1;
    const rankEntryWin = el('rankEntryWin');
    if(isLast){
      el('winHeading').textContent = '모든 스테이지 클리어! 🎉';
      el('winText').textContent = `끝까지 쳤어요! 최종 점수 ${state.score}점, 최대 콤보 ${state.maxCombo}`;
      el('againBtn').textContent = '처음부터 다시';
      onAgain = () => startGame();
      // 랭킹 등록은 전체 클리어(또는 게임오버) 같은 진짜 "끝"에서만 물어본다 —
      // 스테이지 넘어갈 때마다 매번 이름 입력을 띄우면 흐름이 자꾸 끊긴다.
      resetRankEntryWin();
      rankEntryWin.classList.remove('hidden');
    } else {
      el('winHeading').textContent = `스테이지 ${state.stageIndex + 1} 클리어!`;
      el('winText').textContent = `다음 스테이지는 더 빠르고 길어져요. 현재 점수 ${state.score}점`;
      el('againBtn').textContent = '다음 스테이지';
      onAgain = () => startStage(state.stageIndex + 1);
      rankEntryWin.classList.add('hidden');
    }
    winOverlay.classList.remove('hidden');
  }

  // 스테이지 하나를 시작/재시작한다. score·maxCombo는 세션 전체 값이라
  // 여기서 건드리지 않고, lives/두더지 상태만 그 스테이지 기준으로 새로 잡는다.
  function startStage(idx){
    initAudio();
    state.stageIndex = idx;
    state.totalBeats = STAGES[idx].beats;
    beatMs = beatMsForStage(idx);
    moleGrid.style.setProperty('--beat-ms', beatMs + 'ms'); // 구멍 타이머 막대가 한 박에 맞춰 줄어들도록
    state.screen = 'playing';
    state.lives = 3;
    state.combo = 0;
    state.misses = 0;
    state.beatIndex = -LEAD_IN_BEATS;
    state.moleHole = -1; state.moleResolved = true; state.lastHole = -1;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    rankOverlay.classList.add('hidden');
    holes.forEach(h => h.classList.remove('up','hitGood','hitMiss','shake'));
    renderHUD();
    updateBeatInfo();
    clearTimeout(beatTimer);
    // 첫 박자를 버튼을 누른 직후 바로 재생한다 — 다음 박자까지 조용히
    // 기다리게 하지 않고, 탭한 제스처와 최대한 가까이 붙여서 오디오가
    // 확실히 풀리게 한다.
    onBeat();
    nextBeatAt = performance.now() + beatMs;
    scheduleBeat();
  }

  function startGame(){
    resetState();
    startStage(0);
  }
  let onAgain = startGame;
  el('startBtn').addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, {passive:false});
  el('startBtn').addEventListener('click', startGame);
  // retryBtn(스테이지 실패)과 againBtn(스테이지 클리어)은 상황에 따라
  // "이 스테이지 다시"/"다음 스테이지"/"처음부터 다시"로 동작이 바뀌므로,
  // gameOver()/victory()에서 그때그때 정해주는 onAgain을 그대로 호출한다.
  ['retryBtn','againBtn'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); onAgain(); }, {passive:false});
    b.addEventListener('click', () => onAgain());
  });

  function backToMenu(){
    clearTimeout(beatTimer);
    state.screen = 'start';
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }
  ['menuBtnOver','menuBtnWin'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); backToMenu(); }, {passive:false});
    b.addEventListener('click', backToMenu);
  });

  // 백그라운드 전환 시 박자 타이머 정지 → 복귀 시 재개(정확한 누락 박자
  // 복구는 안 하지만, 캐주얼한 연습 게임이라 이 정도면 충분하다).
  document.addEventListener('visibilitychange', () => {
    if(document.hidden){
      clearTimeout(beatTimer);
    } else if(state.screen === 'playing'){
      nextBeatAt = performance.now() + beatMs;
      scheduleBeat();
    }
  });

  renderHUD();
})();
</script>
</body>
</html>
