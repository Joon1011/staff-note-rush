<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17102B">
<title>오선보 노트 러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#17102B;
    --bg-panel:#221a3f;
    --bg-panel-2:#2c2154;
    --gold:#FFC857;
    --coral:#FF6B6B;
    --teal:#4ECDC4;
    --text-primary:#F4EFFF;
    --text-muted:#b3a6dd;
    --pad: max(10px, env(safe-area-inset-left));
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    background:radial-gradient(circle at 50% 0%, #241a46 0%, var(--bg-deep) 70%);
    color:var(--text-primary);
    font-family:'Baloo 2', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:
      max(6px, env(safe-area-inset-top))
      var(--pad)
      max(6px, env(safe-area-inset-bottom))
      var(--pad);
    -webkit-user-select:none; user-select:none;
  }

  .stage{
    width:100%;
    max-width:820px;
    height:100%;
    max-height:900px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border:2px solid #3d2f70;
    border-radius:18px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    padding:10px 12px 12px;
    display:flex; flex-direction:column; gap:8px;
    position:relative; overflow:hidden;
  }

  .titlebar{display:flex; align-items:baseline; gap:8px; flex-shrink:0;}
  h1{
    font-size:clamp(.95rem, 3.6vw, 1.35rem);
    margin:0; color:var(--gold); letter-spacing:.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:clamp(.62rem, 2.2vw, .8rem);
    margin:0;
  }
  /* 세로 화면 좁을 땐 부제 숨김 */
  @media (max-height:620px){ .sub{display:none;} }

  .hud{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace;
    font-size:clamp(.72rem, 2.8vw, .95rem);
    flex-shrink:0;
  }
  .lives{display:flex; gap:3px; font-size:1.15em;}
  .heart{transition:opacity .25s, transform .25s;}
  .heart.off{opacity:.16; transform:scale(.8);}
  .combo{color:var(--coral); font-weight:700;}
  .score{color:var(--teal);}

  .canvasWrap{
    position:relative;
    flex:1 1 auto;
    min-height:130px;
    border-radius:12px;
    overflow:hidden;
    background:#150e29;
    border:1px solid #40315f;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}

  .toast{
    position:absolute; top:8%; left:50%;
    transform:translateX(-50%) scale(.85);
    background:var(--gold); color:#2a1d05; font-weight:800;
    padding:6px 16px; border-radius:999px;
    font-size:clamp(.75rem, 3vw, .95rem);
    opacity:0; pointer-events:none; z-index:5;
    transition:opacity .22s, transform .22s;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) scale(1);}

  .controls{
    flex-shrink:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:7px;
  }
  /* 넓은 화면(태블릿 가로/데스크톱)에서는 한 줄 8칸 */
  @media (min-width:620px){
    .controls{grid-template-columns:repeat(8, 1fr);}
  }
  .noteBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(1rem, 4.4vw, 1.25rem);
    color:var(--bg-deep); background:var(--teal);
    border:none; border-bottom:4px solid #2b8f88; border-radius:12px;
    min-height:clamp(46px, 8.5vh, 66px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1.05; cursor:pointer;
    transition:transform .07s, background .1s;
    touch-action:manipulation;
  }
  .noteBtn small{
    font-family:'Space Mono',monospace;
    font-size:.52em; opacity:.65; margin-top:1px;
  }
  .noteBtn.pressed{transform:translateY(3px); border-bottom-width:1px;}
  .noteBtn:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
  .noteBtn.correctFlash{background:var(--gold);}
  .noteBtn.wrongFlash{background:var(--coral); color:#3a0f0f;}

  .overlay{
    position:absolute; inset:0; z-index:10;
    background:rgba(17,11,35,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:22px; gap:12px;
    overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .overlay h2{font-size:clamp(1.15rem, 5.5vw, 1.7rem); margin:0; color:var(--gold);}
  .overlay p{
    color:var(--text-muted); max-width:36ch; line-height:1.65; margin:0;
    font-size:clamp(.8rem, 3.2vw, .95rem);
  }
  .stars{font-size:clamp(1.8rem, 8vw, 2.4rem); letter-spacing:6px;}
  .primaryBtn{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(.95rem, 4vw, 1.1rem);
    background:var(--gold); color:#2a1d05;
    border:none; border-bottom:4px solid #c99328;
    padding:14px 36px; border-radius:14px; cursor:pointer;
    min-height:52px; margin-top:4px;
  }
  .primaryBtn:active{transform:translateY(3px); border-bottom-width:1px;}
  .sectionLabel{
    font-family:'Space Mono',monospace; color:var(--text-muted);
    font-size:clamp(.6rem, 2.4vw, .7rem); letter-spacing:.04em;
    margin:2px 0 -6px;
  }
  .speedPick, .songPick{display:flex; gap:8px; margin-top:2px; flex-wrap:wrap; justify-content:center;}
  .speedBtn, .songBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(.8rem, 3.4vw, .95rem);
    background:transparent; color:var(--text-muted);
    border:2px solid #4a3a80; border-radius:999px;
    padding:9px 18px; min-height:44px; cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .speedBtn.selected, .songBtn.selected{
    background:var(--teal); color:var(--bg-deep); border-color:var(--teal);
  }
  .linkBtn{
    background:none; border:none; color:var(--text-muted);
    font-family:'Baloo 2', sans-serif; font-size:clamp(.75rem, 3vw, .85rem);
    text-decoration:underline; cursor:pointer; padding:6px; min-height:36px;
  }
  .hint{
    font-family:'Space Mono',monospace;
    font-size:clamp(.6rem, 2.4vw, .72rem); color:var(--text-muted);
  }
  .hidden{ display:none !important; }

  .rankEntry{ display:flex; flex-direction:column; gap:8px; align-items:center; margin-top:2px; width:100%; }
  .rankInput{
    font-family:'Baloo 2', sans-serif; font-size:clamp(.85rem, 3.4vw, 1rem);
    background:#150e29; border:2px solid #4a3a80; border-radius:10px;
    color:var(--text-primary); padding:8px 12px; text-align:center;
    width:min(220px, 80vw);
  }
  .rankInput:focus{ outline:none; border-color:var(--teal); }
  .rankEntryBtns{ display:flex; gap:8px; }
  .miniBtn{
    font-family:'Baloo 2', sans-serif; font-weight:700;
    font-size:clamp(.75rem, 3vw, .88rem);
    background:var(--teal); color:var(--bg-deep); border:none;
    border-radius:999px; padding:8px 16px; cursor:pointer; min-height:38px;
  }
  .miniBtn.ghost{ background:transparent; color:var(--text-muted); border:2px solid #4a3a80; }
  .rankSaved{ color:var(--gold); font-weight:700; font-size:clamp(.78rem, 3vw, .9rem); }

  .rankList{
    list-style:none; padding:0; margin:0; width:100%; max-width:320px;
    display:flex; flex-direction:column; gap:6px; text-align:left;
    max-height:50vh; overflow-y:auto;
  }
  .rankList li{
    display:flex; align-items:center; gap:10px;
    background:#150e29; border:1px solid #40315f; border-radius:10px; padding:8px 12px;
    font-family:'Space Mono',monospace; font-size:clamp(.78rem, 3vw, .9rem);
  }
  .rankNum{ color:var(--gold); font-weight:700; width:1.6em; flex-shrink:0; }
  .rankName{ flex:1; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rankScore{ color:var(--teal); font-weight:700; flex-shrink:0; }
  .rankEmpty{ color:var(--text-muted); text-align:center; list-style:none; padding:8px; }

</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="titlebar">
    <h1>♪ 오선보 노트 러시</h1>
    <p class="sub" id="subLabel">동요 계이름을 보고 알맞은 음을 눌러보세요</p>
  </div>

  <div class="hud">
    <div class="lives" id="lives"></div>
    <div class="combo" id="comboLabel">콤보 0</div>
    <div class="score" id="scoreLabel">점수 0</div>
  </div>

  <div class="canvasWrap" id="canvasWrap">
    <canvas id="game"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="controls" id="controls"></div>

  <div class="overlay" id="startOverlay">
    <h2>오선보 노트 러시</h2>
    <p>음표가 오른쪽에서 나타나 판정선에 닿기 전에, 오선보 위 자리를 보고
    알맞은 음이름 버튼을 눌러주세요. 정답을 맞힐 때마다 그 음이 소리로 들려서
    동요 멜로디를 그대로 연주하게 돼요.</p>
    <div class="sectionLabel">동요 선택</div>
    <div class="songPick" id="songPick">
      <button type="button" class="songBtn selected" data-song="0">곰 세 마리</button>
      <button type="button" class="songBtn" data-song="1">학교종이 땡땡땡</button>
      <button type="button" class="songBtn" data-song="2">나비야</button>
      <button type="button" class="songBtn" data-song="3">🎲 랜덤</button>
    </div>
    <button type="button" class="linkBtn" id="previewBtn">▶ 멜로디 미리듣기</button>
    <div class="sectionLabel">속도 선택</div>
    <div class="speedPick" id="speedPick">
      <button type="button" class="speedBtn" data-speed="3.6">느리게</button>
      <button type="button" class="speedBtn selected" data-speed="2.6">보통</button>
      <button type="button" class="speedBtn" data-speed="1.9">빠르게</button>
    </div>
    <button class="primaryBtn" id="startBtn">시작하기</button>
    <a class="linkBtn" href="./beat-mole.html">🔨 망치 박자 게임으로 가기</a>
    <a class="linkBtn" href="./fireworks.html">🎆 리듬 불꽃놀이로 가기</a>
    <button type="button" class="linkBtn" id="viewRankBtn">🏆 랭킹 보기</button>
    <div class="hint">소리가 나와요 · 무음 모드를 꺼주세요</div>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <h2>다시 도전해볼까?</h2>
    <p id="overText"></p>
    <div class="rankEntry" id="rankEntryOver">
      <div class="rankForm" id="rankFormOver">
        <input type="text" class="rankInput" id="rankNameOver" placeholder="이름(최대 12자)" maxlength="12">
        <div class="rankEntryBtns">
          <button type="button" class="miniBtn" id="rankSubmitOver">랭킹 등록</button>
          <button type="button" class="miniBtn ghost" id="rankSkipOver">건너뛰기</button>
        </div>
      </div>
      <div class="rankSaved hidden" id="rankSavedOver">✅ 랭킹에 등록됐어요!</div>
    </div>
    <button class="primaryBtn" id="retryBtn">다시 시작</button>
    <button type="button" class="linkBtn" id="menuBtnOver">다른 동요 선택</button>
  </div>

  <div class="overlay hidden" id="winOverlay">
    <h2 id="winHeading">완주했어요!</h2>
    <div class="stars" id="starsLabel"></div>
    <p id="winText"></p>
    <div class="rankEntry" id="rankEntryWin">
      <div class="rankForm" id="rankFormWin">
        <input type="text" class="rankInput" id="rankNameWin" placeholder="이름(최대 12자)" maxlength="12">
        <div class="rankEntryBtns">
          <button type="button" class="miniBtn" id="rankSubmitWin">랭킹 등록</button>
          <button type="button" class="miniBtn ghost" id="rankSkipWin">건너뛰기</button>
        </div>
      </div>
      <div class="rankSaved hidden" id="rankSavedWin">✅ 랭킹에 등록됐어요!</div>
    </div>
    <button class="primaryBtn" id="againBtn">한 번 더 하기</button>
    <button type="button" class="linkBtn" id="menuBtnWin">다른 동요 선택</button>
  </div>

  <div class="overlay hidden" id="rankOverlay">
    <h2>🏆 랭킹 TOP 10</h2>
    <ol class="rankList" id="rankingList"></ol>
    <button type="button" class="linkBtn" id="closeRankBtn">닫기</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // 도(C4) ~ 높은도(C5). step: 오선보 아래 첫째줄(E4)=0 기준 반칸 단위
  const NOTES = [
    { name:'도',  sub:'C4', freq:261.63, step:-2, ledger:true  },
    { name:'레',  sub:'D4', freq:293.66, step:-1, ledger:false },
    { name:'미',  sub:'E4', freq:329.63, step: 0, ledger:false },
    { name:'파',  sub:'F4', freq:349.23, step: 1, ledger:false },
    { name:'솔',  sub:'G4', freq:392.00, step: 2, ledger:false },
    { name:'라',  sub:'A4', freq:440.00, step: 3, ledger:false },
    { name:'시',  sub:'B4', freq:493.88, step: 4, ledger:false },
    { name:'도′', sub:'C5', freq:523.25, step: 5, ledger:false },
  ];
  const NOTE_INDEX_BY_NAME = Object.fromEntries(NOTES.map((n, i) => [n.name, i]));

  // 실제 동요 멜로디의 계이름을 그대로 옮겨 정답을 맞힐 때마다 그 노래가
  // 들리게 한다(단순 무작위 음이 아니라 진짜 노래를 "연주"하는 느낌).
  // 각 곡의 계이름은 가사 음절 수와 대조해 맞춰본 것 — 혹시 한두 음이
  // 실제 악보와 다르면 아래 names 배열만 고치면 바로 반영된다.
  const SONGS = [
    {
      title:'곰 세 마리',
      names:[
        '도','도','도','도','도','미','솔','솔','미','도',
        '솔','솔','미','솔','솔','미','도','도','도',
        '솔','솔','미','도','솔','솔','솔',
        '솔','솔','미','도','솔','솔','솔',
        '솔','솔','미','도','솔','솔','솔','라','솔',
        '도','솔','도','솔','미','레','도',
      ],
    },
    {
      title:'학교종이 땡땡땡',
      names:[
        '솔','솔','라','라','솔','솔','미',
        '솔','솔','미','미','레',
        '솔','솔','라','라','솔','솔','미',
        '솔','미','레','미','도',
      ],
    },
    {
      title:'나비야',
      names:[
        '솔','미','미','파','레','레','도','레','미','파','솔','솔','솔',
        '솔','미','미','미','파','레','레','도','미','솔','솔','미','미','미',
        '레','레','레','레','레','미','파','미','미','미','미','미','파','솔',
        '솔','미','미','파','레','레','도','미','솔','솔','미','미','미',
      ],
    },
  ].map(song => ({ ...song, sequence: song.names.map(nm => NOTE_INDEX_BY_NAME[nm]) }));

  const el = id => document.getElementById(id);
  const canvas = el('game'), ctx = canvas.getContext('2d');
  const wrap = el('canvasWrap');
  const livesEl = el('lives'), comboEl = el('comboLabel'), scoreEl = el('scoreLabel');
  const subEl = el('subLabel');
  const toastEl = el('toast');
  const startOverlay = el('startOverlay'), overOverlay = el('overOverlay'), winOverlay = el('winOverlay');
  const rankOverlay = el('rankOverlay');
  const controls = el('controls');

  // ---------- 랭킹(이 기기/브라우저에만 저장) ----------
  const RANKING_KEY = 'noteRushRanking_v1';
  const RANKING_MAX = 10;
  function loadRanking(){
    try {
      const raw = localStorage.getItem(RANKING_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch(e){ return []; }
  }
  function addRankingEntry(name, score){
    const list = loadRanking();
    list.push({ name: (name || '이름없음').slice(0, 12), score, date: new Date().toISOString().slice(0, 10) });
    list.sort((a, b) => b.score - a.score);
    list.length = Math.min(list.length, RANKING_MAX);
    try { localStorage.setItem(RANKING_KEY, JSON.stringify(list)); } catch(e){}
  }
  function renderRankingList(){
    const list = loadRanking();
    const listEl = el('rankingList');
    listEl.innerHTML = '';
    if(list.length === 0){
      const li = document.createElement('li');
      li.className = 'rankEmpty';
      li.textContent = '아직 등록된 기록이 없어요.';
      listEl.appendChild(li);
      return;
    }
    list.forEach((r, i) => {
      const li = document.createElement('li');
      const num = document.createElement('span'); num.className = 'rankNum'; num.textContent = `${i + 1}`;
      const name = document.createElement('span'); name.className = 'rankName'; name.textContent = r.name;
      const score = document.createElement('span'); score.className = 'rankScore'; score.textContent = `${r.score}점`;
      li.append(num, name, score);
      listEl.appendChild(li);
    });
  }
  // overOverlay/winOverlay에 각각 붙는 "이름 입력 → 랭킹 등록/건너뛰기" 미니 폼.
  // 라운드가 끝날 때마다 resetRankEntry*()로 새 폼 상태로 되돌려준다.
  function setupRankEntry(prefix, getScore){
    const form = el('rankForm' + prefix);
    const saved = el('rankSaved' + prefix);
    const input = el('rankName' + prefix);
    const submit = () => {
      addRankingEntry(input.value.trim(), getScore());
      form.classList.add('hidden');
      saved.classList.remove('hidden');
    };
    const skip = () => {
      form.classList.add('hidden');
      saved.classList.add('hidden');
    };
    const submitBtn = el('rankSubmit' + prefix), skipBtn = el('rankSkip' + prefix);
    submitBtn.addEventListener('touchstart', e => { e.preventDefault(); submit(); }, {passive:false});
    submitBtn.addEventListener('click', submit);
    skipBtn.addEventListener('touchstart', e => { e.preventDefault(); skip(); }, {passive:false});
    skipBtn.addEventListener('click', skip);
    input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
    return () => {
      form.classList.remove('hidden');
      saved.classList.add('hidden');
      input.value = '';
    };
  }
  const resetRankEntryOver = setupRankEntry('Over', () => state.score);
  const resetRankEntryWin = setupRankEntry('Win', () => state.score);

  const viewRankBtn = el('viewRankBtn'), closeRankBtn = el('closeRankBtn');
  const openRanking = e => {
    if(e) e.preventDefault();
    renderRankingList();
    startOverlay.classList.add('hidden');
    rankOverlay.classList.remove('hidden');
  };
  const closeRanking = e => {
    if(e) e.preventDefault();
    rankOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  };
  viewRankBtn.addEventListener('touchstart', openRanking, {passive:false});
  viewRankBtn.addEventListener('click', openRanking);
  closeRankBtn.addEventListener('touchstart', closeRanking, {passive:false});
  closeRankBtn.addEventListener('click', closeRanking);

  // ---------- 반응형 캔버스 ----------
  let W = 0, H = 0, geo = null;
  function layout(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lineGap    = H * 0.115;              // 오선 줄 간격
    const bottomLine = H * 0.70;               // 맨 아래 줄(E4)
    geo = {
      lineGap,
      bottomLine,
      half: lineGap / 2,
      staffLeft: W * 0.13,
      judgeX: Math.max(W * 0.20, 54),
      spawnX: W - Math.max(W * 0.05, 18),
      noteRx: lineGap * 0.46,
      noteRy: lineGap * 0.34,
      stem: lineGap * 1.5,
      clefSize: lineGap * 6.4,
    };
  }
  const yOf = step => geo.bottomLine - step * geo.half;

  if (window.ResizeObserver) new ResizeObserver(() => { layout(); }).observe(wrap);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));

  // ---------- 사운드 ----------
  let audioCtx = null;
  function initAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    // resume()는 비동기라 완료 전에 tone()이 먼저 불리면 상태가 아직
    // 'suspended'일 수 있다 — audioCtx 존재 여부만 확인하고 바로 스케줄해서,
    // resume이 늦게 끝나도 그 소리가 통째로 씹히지 않게 한다.
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }
  function tone(freq, dur=0.4){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function buzz(){
    if(navigator.vibrate) navigator.vibrate(60);
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = 110;
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.26);
  }

  // 시작 전에 그 동요가 실제로 어떻게 들리는지 미리 들려준다 — "감으로 아무
  // 버튼이나 누르는" 게 아니라 "이 멜로디를 내가 직접 쳐본다"는 느낌이 나야
  // 게임하는 맛이 산다는 피드백을 반영.
  function previewSong(song){
    initAudio();
    const play = () => {
      const noteDur = 0.34;
      song.sequence.forEach((idx, i) => {
        setTimeout(() => tone(NOTES[idx].freq, noteDur * 0.85), i * noteDur * 1000);
      });
    };
    if(audioCtx && audioCtx.state === 'running') play();
    else if(audioCtx) audioCtx.resume().then(play);
  }
  const previewBtn = el('previewBtn');
  const firePreview = e => { e.preventDefault(); previewSong(getSelectedSong()); };
  previewBtn.addEventListener('touchstart', firePreview, {passive:false});
  previewBtn.addEventListener('click', firePreview);

  // ---------- 버튼(터치 우선) ----------
  const buttons = NOTES.map((n, i) => {
    const b = document.createElement('button');
    b.className = 'noteBtn';
    b.type = 'button';
    b.innerHTML = `${n.name}<small>${n.sub}</small>`;
    b.setAttribute('aria-label', `${n.name} 음`);

    let handled = false;
    const fire = e => {
      e.preventDefault();
      handled = true;
      b.classList.add('pressed');
      answer(i, b);
      setTimeout(() => { handled = false; }, 350);
    };
    b.addEventListener('touchstart', fire, {passive:false});
    b.addEventListener('mousedown', e => { if(!handled) fire(e); });
    b.addEventListener('click', e => e.preventDefault());
    const release = () => b.classList.remove('pressed');
    ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev =>
      b.addEventListener(ev, release));
    b.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); answer(i, b); }
    });
    controls.appendChild(b);
    return b;
  });

  window.addEventListener('keydown', e => {
    const k = parseInt(e.key, 10);
    if(k >= 1 && k <= 8 && state.screen === 'playing') answer(k - 1, buttons[k - 1]);
  });

  // ---------- 속도 선택 ----------
  let baseTravel = 2.6;    // 기본 "보통"
  let minTravel  = 1.2;    // 레벨업 하한
  document.querySelectorAll('.speedBtn').forEach(b => {
    const pick = e => {
      e.preventDefault();
      document.querySelectorAll('.speedBtn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      baseTravel = parseFloat(b.dataset.speed);
      minTravel  = baseTravel * 0.46;
    };
    b.addEventListener('touchstart', pick, {passive:false});
    b.addEventListener('click', pick);
  });

  // ---------- 동요 선택 ----------
  let selectedSongIndex = 0;
  document.querySelectorAll('.songBtn').forEach((b, i) => {
    const pick = e => {
      e.preventDefault();
      document.querySelectorAll('.songBtn').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
      selectedSongIndex = i;
    };
    b.addEventListener('touchstart', pick, {passive:false});
    b.addEventListener('click', pick);
  });

  // "랜덤"은 목록에 없는 고정곡이 아니라, 고를 때마다 8개 음 중에서 매번 새로
  // 뽑아 만든 시퀀스다 — SONGS 배열 길이(3)를 그대로 "랜덤" 인덱스로 쓴다.
  const RANDOM_LENGTH = 40;
  function buildRandomSequence(){
    return Array.from({length: RANDOM_LENGTH}, () => Math.floor(Math.random() * NOTES.length));
  }
  function getSelectedSong(){
    if(selectedSongIndex === SONGS.length){
      return { title:'랜덤', sequence: buildRandomSequence() };
    }
    return SONGS[selectedSongIndex];
  }

  // ---------- 게임 상태 ----------
  let state;
  function resetState(){
    state = {
      screen:'start',
      score:0, combo:0, maxCombo:0,
      lives:3, correct:0, misses:0,
      level:1, travelTime:baseTravel,  // 판정선까지 도달 시간(초) — 화면 크기와 무관
      song: getSelectedSong(),
      songPos:0,
      current:null,
    };
  }
  resetState();

  function renderHUD(){
    livesEl.innerHTML = '';
    for(let i = 0; i < 3; i++){
      const s = document.createElement('span');
      s.className = 'heart' + (i < state.lives ? '' : ' off');
      s.textContent = '♥';
      livesEl.appendChild(s);
    }
    comboEl.textContent = `콤보 ${state.combo}`;
    scoreEl.textContent = `점수 ${state.score}`;
    if(state.screen === 'playing'){
      subEl.textContent = `${state.song.title} · ${state.songPos}/${state.song.sequence.length}`;
    }
  }

  let toastTimer = null;
  function showToast(msg, ms=1100){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  function spawnNote(){
    if(state.screen !== 'playing') return;
    const idx = state.song.sequence[state.songPos];
    state.current = { idx, x: geo.spawnX, resolved:false, flashFrames:0, flashType:null };
  }

  // 정답이든 오답이든 노래는 계속 앞으로 흘러간다 — 한 음에서 막혀버리면
  // 안 되니, 다음 음으로 넘어가고 그게 노래의 끝이면 클리어 처리한다.
  function advanceSong(delay){
    state.songPos++;
    if(state.songPos >= state.song.sequence.length) setTimeout(victory, delay);
    else setTimeout(spawnNote, delay);
  }

  function answer(idx, btn){
    if(state.screen !== 'playing' || !state.current || state.current.resolved) return;
    const n = state.current;
    if(idx === n.idx){
      n.resolved = true;
      state.correct++;
      state.combo++;
      state.maxCombo = Math.max(state.maxCombo, state.combo);
      state.score += 10 + Math.min(state.combo, 10) * 2;
      tone(NOTES[idx].freq);
      flashBtn(btn, 'correctFlash');
      if(state.combo > 0 && state.combo % 5 === 0) showToast(`콤보 ${state.combo}! 🔥`);
      maybeLevelUp();
      renderHUD();
      advanceSong(90);
    } else {
      n.resolved = true;
      n.flashFrames = 20; n.flashType = 'wrong';
      state.combo = 0; state.lives--; state.misses++;
      buzz();
      // 틀려도 원래 음은 들려준다 — 멜로디 흐름이 안 끊겨야 "노래를 치고
      // 있다"는 느낌이 유지되고, 정답 음이 뭐였는지 귀로도 익힐 수 있다.
      setTimeout(() => tone(NOTES[n.idx].freq, 0.28), 120);
      flashBtn(btn, 'wrongFlash');
      renderHUD();
      if(state.lives <= 0) setTimeout(gameOver, 300);
      else advanceSong(550);
    }
  }
  function flashBtn(btn, cls){
    if(!btn) return;
    btn.classList.add(cls);
    setTimeout(() => btn.classList.remove(cls), 220);
  }

  function maybeLevelUp(){
    if(state.correct > 0 && state.correct % 5 === 0){
      state.level++;
      state.travelTime = Math.max(state.travelTime / 1.18, minTravel);
      showToast('레벨 업! 조금 더 빨라져요 🎵');
    }
  }

  function missCurrent(){
    const n = state.current;
    if(!n || n.resolved) return;
    n.resolved = true;
    state.combo = 0; state.lives--; state.misses++;
    buzz();
    setTimeout(() => tone(NOTES[n.idx].freq, 0.28), 120);
    renderHUD();
    if(state.lives <= 0) setTimeout(gameOver, 250);
    else advanceSong(450);
  }

  function gameOver(){
    // setTimeout으로 지연 호출되는 함수라, 그 사이 사용자가 메뉴로 나가거나
    // 새 게임을 시작해 screen이 이미 바뀌었으면 옛 라운드의 결과로 화면을
    // 덮어써선 안 된다.
    if(state.screen !== 'playing') return;
    state.screen = 'gameover';
    el('overText').textContent =
      `${state.song.title}, ${state.songPos}/${state.song.sequence.length}음까지 갔어요. 점수 ${state.score}점 · 최대 콤보 ${state.maxCombo}. 다음엔 더 잘할 수 있어요!`;
    resetRankEntryOver();
    overOverlay.classList.remove('hidden');
  }
  function victory(){
    if(state.screen !== 'playing') return;
    state.screen = 'victory';
    const stars = state.misses === 0 ? 3 : state.misses <= 2 ? 2 : 1;
    el('starsLabel').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    el('winHeading').textContent = `${state.song.title} 완주!`;
    el('winText').textContent =
      `끝까지 연주했어요! 최종 점수 ${state.score}점, 최대 콤보 ${state.maxCombo}`;
    resetRankEntryWin();
    winOverlay.classList.remove('hidden');
  }

  function startGame(){
    initAudio();
    layout();
    resetState();
    state.screen = 'playing';
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    rankOverlay.classList.add('hidden');
    renderHUD();
    spawnNote();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }
  ['startBtn','retryBtn','againBtn'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); startGame(); }, {passive:false});
    b.addEventListener('click', startGame);
  });

  function backToMenu(){
    state.screen = 'start';
    overOverlay.classList.add('hidden');
    winOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }
  ['menuBtnOver','menuBtnWin'].forEach(id => {
    const b = el(id);
    b.addEventListener('touchstart', e => { e.preventDefault(); backToMenu(); }, {passive:false});
    b.addEventListener('click', backToMenu);
  });

  // 백그라운드 전환 시 일시정지 → 복귀 시 재개
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden && state.screen === 'playing'){
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  });

  // ---------- 그리기 ----------
  function drawStaff(){
    ctx.lineWidth = Math.max(1.2, H * 0.006);
    ctx.strokeStyle = '#EDE6FF';
    for(let i = 0; i < 5; i++){
      const y = geo.bottomLine - i * geo.lineGap;
      ctx.beginPath();
      ctx.moveTo(geo.staffLeft, y);
      ctx.lineTo(W - 4, y);
      ctx.stroke();
    }
    ctx.fillStyle = '#FFC857';
    ctx.font = `${geo.clefSize}px Georgia, 'Times New Roman', serif`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('𝄞', W * 0.015, geo.bottomLine + geo.lineGap * 0.55);

    ctx.save();
    ctx.strokeStyle = 'rgba(78,205,196,.6)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(geo.judgeX, geo.bottomLine - geo.lineGap * 5.4);
    ctx.lineTo(geo.judgeX, geo.bottomLine + geo.lineGap * 1.6);
    ctx.stroke();
    ctx.restore();
  }

  function drawNote(n){
    const def = NOTES[n.idx];
    const y = yOf(def.step);
    let color = '#FFC857';
    if(n.flashType === 'wrong' && n.flashFrames > 0){ color = '#FF6B6B'; n.flashFrames--; }

    if(def.ledger){
      ctx.strokeStyle = '#EDE6FF';
      ctx.lineWidth = Math.max(1.2, H * 0.006);
      ctx.beginPath();
      ctx.moveTo(n.x - geo.noteRx * 1.7, y);
      ctx.lineTo(n.x + geo.noteRx * 1.7, y);
      ctx.stroke();
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1.6, geo.lineGap * 0.11);
    ctx.beginPath();
    if(def.step <= 2){ ctx.moveTo(n.x + geo.noteRx * 0.9, y); ctx.lineTo(n.x + geo.noteRx * 0.9, y - geo.stem); }
    else            { ctx.moveTo(n.x - geo.noteRx * 0.9, y); ctx.lineTo(n.x - geo.noteRx * 0.9, y + geo.stem); }
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.save();
    ctx.translate(n.x, y);
    ctx.rotate(-0.35);
    ctx.beginPath();
    ctx.ellipse(0, 0, geo.noteRx, geo.noteRy, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let lastTime = 0;
  function loop(t){
    if(state.screen !== 'playing') return;
    if(document.hidden){ return; }
    const dt = Math.min((t - lastTime) / 1000, 0.05);
    lastTime = t;

    ctx.clearRect(0, 0, W, H);
    drawStaff();

    const n = state.current;
    if(n){
      if(!n.resolved){
        const speed = (geo.spawnX - geo.judgeX) / state.travelTime;  // px/s, 화면폭에 자동 비례
        n.x -= speed * dt;
        if(n.x <= geo.judgeX){ n.x = geo.judgeX; missCurrent(); }
      }
      drawNote(n);
    }
    requestAnimationFrame(loop);
  }

  layout();
  renderHUD();
})();
</script>
</body>
</html>
